function jobPct(j) {
  if (j.state === 'done') return 100;
  // 优先按字节算：单个大文件下载过程中也能连续走到 100%
  if (j.size) return Math.min(100, (j.bytes || 0) * 100 / j.size);
  if (j.total) return Math.min(100, j.done * 100 / j.total);
  return 0;
}

function findJob() {
  for (var i = 0; i < S.jobs.length; i++) if (S.jobs[i].job_id === S.jobSel) return S.jobs[i];
  return null;
}

/* 进度类字段高频刷新，只改文本、不重建 DOM，避免详情页闪烁和滚动跳动 */
function updateJobDetail(j) {
  var bar = document.getElementById('jdBar');
  if (!bar) return false;
  var pct = jobPct(j);
  bar.style.width = pct + '%';
  document.getElementById('jdPct').textContent = pct.toFixed(0) + '%';
  document.getElementById('jdCount').textContent =
    j.done + ' / ' + (j.total || '—') + ' 个文件' + (j.failed ? ' · 失败 ' + j.failed : '');
  document.getElementById('jdSize').textContent =
    bytes(j.bytes) + (j.size ? ' / ' + bytes(j.size) : '');
  var sp = j.speed || 0;
  setKV('jdStage', j.stage || '', true);
  setKV('jdSpeed', sp > 0 && j.state === 'running' ? bytes(sp) + '/s' : '', true);
  setKV('jdCur', j.state === 'running' ? (j.current || '') : '');
  return true;
}

function setKV(id, text, accent) {
  var k = document.getElementById(id + 'K'), v = document.getElementById(id);
  if (!k || !v) return;
  var on = !!text;
  k.style.display = on ? '' : 'none';
  v.style.display = on ? '' : 'none';
  if (accent) v.style.color = 'var(--accent)';
  v.textContent = text || '';
}

function paintJobDetail(body) {
  var j = findJob();
  if (!j) { body.innerHTML = ''; body.dataset.jkey = ''; return; }
  var files = (j.files || []).slice().reverse();
  var bads = files.filter(function (f) { return f.error; });
  var steps = j.steps || [];
  var lastStep = steps.length ? (steps[steps.length - 1].label + ':' + steps[steps.length - 1].status) : '';
  var key = j.job_id + '|' + j.state + '|' + files.length + '|' + j.failed + '|' + (j.error || '')
    + '|' + (j.reused || 0) + '|' + (j.note || '') + '|' + steps.length + '|' + lastStep + '|' + (j.stage || '');
  if (body.dataset.jkey === key) { updateJobDetail(j); return; }
  body.dataset.jkey = key;

  var st = JOB_STATE[j.state] || { t: j.state, c: '#a1a1aa' };
  var pct = jobPct(j);
  var sp = j.speed || 0;
  var active = ['queued', 'running', 'cancelling'].indexOf(j.state) >= 0;
  var cls = j.state === 'done' ? 'done' : (j.state === 'failed' || j.state === 'partial' || j.state === 'interrupted') ? 'fail' : '';
  body.innerHTML = '<div class="pad">'
    + '<div class="box" style="margin-bottom:10px"><div class="box-hd">' + I.dl
    + '<span>' + esc(j.title || j.peer) + '</span><span class="tag">' + st.t + '</span><span style="flex:1"></span>'
    + (active ? '<button class="btn sm" id="btnCancelJob">' + I.stop + '<span>停止</span></button>' : '')
    + (!active && j.kind !== 'transfer' ? '<button class="btn sm" id="btnRedoJob" title="忽略本地已有文件，从 Telegram 重新下载一遍">'
        + I.dl + '<span>重新下载</span></button>' : '')
    + (jobRetryable(j) ? '<button class="btn primary sm" id="btnRetryJob">' + I.refresh
        + '<span>重试失败项</span></button>' : '')
    + '</div><div class="box-bd">'
    + '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">'
    + '<div style="flex:1"><div class="pbar ' + cls + '" style="height:6px"><i id="jdBar" style="width:' + pct + '%"></i></div></div>'
    + '<b style="font-size:12px" id="jdPct">' + pct.toFixed(0) + '%</b></div>'
    + '<div class="kv">'
    + (j.stage ? '<span class="k" id="jdStageK">当前阶段</span><span class="v" id="jdStage" style="color:var(--accent);font-weight:600">' + esc(j.stage) + '</span>' : '')
    + '<span class="k">进度</span><span class="v" id="jdCount">' + j.done + ' / ' + (j.total || '—') + ' 个文件'
    + (j.failed ? ' · 失败 ' + j.failed : '') + '</span>'
    + (j.reused ? '<span class="k">本地复用</span><span class="v" style="color:#0f766e">' + j.reused
        + ' 个（已存在，没有重复下载）</span>' : '')
    + '<span class="k">大小</span><span class="v" id="jdSize">' + bytes(j.bytes) + (j.size ? ' / ' + bytes(j.size) : '') + '</span>'
    + '<span class="k" id="jdSpeedK"' + (active && sp ? '' : ' style="display:none"') + '>速度</span>'
    + '<span class="v" id="jdSpeed"' + (active && sp ? '' : ' style="display:none"') + '>'
    + (sp ? bytes(sp) + '/s' : '') + '</span>'
    + '<span class="k" id="jdCurK"' + (active && j.current ? '' : ' style="display:none"') + '>正在下载</span>'
    + '<span class="v" id="jdCur" style="word-break:break-all' + (active && j.current ? '' : ';display:none') + '">'
    + esc(active ? (j.current || '') : '') + '</span>'
    + '<span class="k">来源对话</span><span class="v">' + esc(j.peer || '') + '</span>'
    + '<span class="k">目标目录</span><span class="v">' + esc(j.outdir || '') + '</span>'
    + '<span class="k">创建时间</span><span class="v">' + fullTime(j.created) + '</span>'
    + (j.finished ? '<span class="k">结束时间</span><span class="v">' + fullTime(j.finished) + '</span>' : '')
    + (j.retry_of ? '<span class="k">重试来源</span><span class="v">' + esc(j.retry_of) + '</span>' : '')
    + (j.note && j.state !== 'running' ? '<span class="k">说明</span><span class="v" style="color:#0f766e">'
        + esc(j.note) + '</span>' : '')
    + (j.error ? '<span class="k" style="color:var(--bad)">错误</span><span class="v" style="color:var(--bad)">' + esc(j.error) + '</span>' : '')
    + '</div></div></div>'
    + (steps.length
      ? '<div class="box" style="margin-bottom:10px"><div class="box-hd">执行步骤与状态流 '
        + '<span class="muted" style="font-weight:400">' + steps.length + ' 步</span>'
        + (j.kind === 'transfer' ? '<span class="tag teal" style="margin-left:auto">收藏转存归档</span>' : '')
        + '</div><div class="box-bd"><div class="steplist">'
        + steps.map(function (s) {
          var stCls = s.status === 'error' ? 'error' : (s.status === 'running' ? 'running' : 'done');
          var ic = s.status === 'error' ? '✕' : (s.status === 'running' ? '⟳' : '✓');
          return '<div class="steprow ' + stCls + '">'
            + '<span class="st-ic">' + ic + '</span>'
            + '<div class="st-main"><div class="st-lb">' + esc(s.label || '') + '</div>'
            + (s.detail ? '<div class="st-dt">' + esc(s.detail) + '</div>' : '')
            + '</div><span class="st-tm">' + timeStr(s.ts) + '</span></div>';
        }).join('') + '</div></div></div>'
      : '')
    + (bads.length
      ? '<div class="box" style="margin-bottom:10px"><div class="box-hd" style="color:var(--bad)">失败原因 '
        + '<span class="muted" style="font-weight:400">' + bads.length + '</span></div><div class="box-bd">'
        + bads.map(function (f) {
          return '<div class="failrow"><span class="fn" title="' + esc(f.name || '') + '">' + esc(f.name || '')
            + '</span><span class="fr">' + esc(f.error || '') + '</span></div>';
        }).join('') + '</div></div>'
      : '')
    + '<div class="box"><div class="box-hd">文件 <span class="muted" style="font-weight:400">' + files.length + '</span></div>'
    + (files.length
      ? '<table class="tbl"><thead><tr><th>文件</th><th style="width:76px">大小</th><th style="width:46%">状态 / 位置</th></tr></thead><tbody>'
        + files.map(function (f) {
          var state = f.error
            ? '<span style="color:var(--bad)">' + esc(f.error) + '</span>'
            : '<span class="muted">' + esc(f.path || '已保存')
              + (f.reused === 'link' ? ' · 已存在（硬链接复用）'
                 : f.reused === 'copy' ? ' · 已存在（复制）'
                 : f.skipped ? ' · 已存在' : '') + '</span>';
          return '<tr><td class="nm">' + esc(f.name || '') + (f.error ? ' <span class="tag red">失败</span>' : '') + '</td>'
            + '<td>' + (f.size ? bytes(f.size) : '—') + '</td>'
            + '<td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + state + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty-sm">还没有完成的文件</div>')
    + '</div></div>';
  var c = $('#btnCancelJob');
  if (c) c.addEventListener('click', function () {
    api('download.cancel', { job_id: j.job_id }).then(function () { toast('已请求停止'); refreshJobs(); })
      .catch(function (e) { toast(e.message); });
  });
  var rb = $('#btnRetryJob');
  if (rb) rb.addEventListener('click', function () { retryJob(j.job_id); });
  var rd = $('#btnRedoJob');
  if (rd) rd.addEventListener('click', function () {
    if (!confirm('忽略本地已有的文件，从 Telegram 重新下载这个任务的全部文件？\n已经下好的同名文件会被覆盖。')) return;
    rd.disabled = true; rd.textContent = '创建中…';
    api('download.redo', { job_id: j.job_id }).then(function (d) {
      toast('已创建重新下载任务 ' + d.job_id);
      S.jobSel = d.job_id; S.taskView = 'job'; refreshJobs();
    }).catch(function (e) { rd.disabled = false; rd.textContent = '重新下载'; toast(e.message); });
  });
}

function refreshJobs(force) {
  return api('task.list').then(function (d) {
    S.jobs = d.jobs || [];
  }).catch(function () {}).then(function () {
    var still = false;
    for (var i = 0; i < S.jobs.length; i++) if (S.jobs[i].job_id === S.jobSel) still = true;
    if (!still && S.taskView === 'job') { S.taskView = 'new'; S.jobSel = null; }
    paintJobs();
    if (S.page === 'tasks') { paintTaskTabs(); paintTaskBody(); }
  });
}

function openBatchDialog() {
  var go2 = function (dialogs) {
    var initPeer = S.peer || (dialogs[0] && dialogs[0].peer) || '';
    openDlg('批量下载', '<div class="field"><label>选择对话（可搜索）</label>'
      + peerPickerHtml('bd', dialogs, initPeer)
      + '</div>'
      + '<div class="field"><label>下载范围与模式</label>'
      + '<div class="seg" id="bdModeSeg">'
      + '<button data-m="new" class="on">新增下载（接力上次）</button>'
      + '<button data-m="all">全部下载（整个对话）</button>'
      + '<button data-m="limit">指定数量（最近 N 条）</button>'
      + '</div>'
      + '<div id="bdLimitBox" style="display:none;margin-top:8px">'
      + '<div class="field-row" style="align-items:center">'
      + '<input class="inp" id="bdLimit" type="number" value="50" min="1" style="flex:1" placeholder="输入要下载的条数">'
      + '<button class="btn sm" data-q="50">50 条</button>'
      + '<button class="btn sm" data-q="200">200 条</button>'
      + '<button class="btn sm" data-q="1000">1000 条</button>'
      + '</div></div>'
      + '<div class="tip" id="bdModeTip">正在检查该对话的历史下载记录…</div></div>'
      + '<div class="field"><label>保存到</label><input class="inp" id="bdOut" value="' + esc((S.status && S.status.config && S.status.config.download_dir) || '') + '"></div>',
      '<button class="btn" onclick="closeDlg()">取消</button><button class="btn primary" id="bdGo">开始下载</button>', true);
    bindPeerPicker('bd', dialogs);

    var curMode = 'new';
    var lastMaxId = 0;
    function updateModeTip() {
      var tip = $('#bdModeTip');
      if (!tip) return;
      if (curMode === 'new') {
        tip.innerHTML = lastMaxId > 0
          ? '已检测到上次下载至消息 <b>#' + lastMaxId + '</b>，本次将自动下载 <b>#' + lastMaxId + ' 之后新增</b>的全部媒体。'
          : '该对话尚无本地下载记录，「新增下载」将自动拉取该对话的全部媒体。';
      } else if (curMode === 'all') {
        tip.innerHTML = '不限数量，扫描整个对话的所有历史媒体（本地已存在的文件会自动跳过，不会重复下载）。';
      } else {
        tip.innerHTML = '按消息从新到旧倒序扫描最近 N 条消息中的媒体。';
      }
    }
    function checkPeerProg(p) {
      if (!p) return;
      api('dialog.progress', { peer: p }).then(function (d) {
        lastMaxId = (d && d.max_downloaded_id) || 0;
        updateModeTip();
      }).catch(function () { lastMaxId = 0; updateModeTip(); });
    }
    checkPeerProg(initPeer);
    $('#bdList').addEventListener('click', function () {
      setTimeout(function () { checkPeerProg($('#bdPeer').value); }, 10);
    });
    $$('#bdModeSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        curMode = b.dataset.m;
        $$('#bdModeSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
        $('#bdLimitBox').style.display = curMode === 'limit' ? 'block' : 'none';
        updateModeTip();
      });
    });
    $$('#bdLimitBox button[data-q]').forEach(function (b) {
      b.addEventListener('click', function () { $('#bdLimit').value = b.dataset.q; });
    });

    $('#bdGo').addEventListener('click', function () {
      var btn = $('#bdGo');
      if (btn.disabled) return;
      var peer = $('#bdPeer').value, out = $('#bdOut').value.trim();
      var limit = curMode === 'limit' ? (Number($('#bdLimit').value) || 50) : 0;
      if (!peer) { toast('先选一个对话'); return; }
      btn.disabled = true; btn.textContent = '创建中…';
      api('download.start', { peer: peer, mode: curMode, limit: limit, ids: [], outdir: out || undefined }).then(function (d) {
        closeDlg(); toast('任务已创建 #' + d.job_id);
        S.taskView = 'job'; S.jobSel = d.job_id; refreshJobs();
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = '开始下载';
        toast(e.message);
      });
    });
  };
  if (S.dialogs.length) return go2(S.dialogs);
  api('dialog.list', { limit: 200 }).then(function (d) { S.dialogs = d.rows || []; go2(S.dialogs); })
    .catch(function () { go2([]); });
}

function openLinkDialog() {
  openDlg('链接下载（支持受限频道 / 禁止转发内容下载）', '<div class="field"><label>消息链接（每行一条）</label>'
    + '<textarea class="inp" id="lkText" style="height:104px;padding:6px 8px;resize:vertical" placeholder="https://t.me/durov/123&#10;https://t.me/c/1234567890/45&#10;https://t.me/c/1234567890/15/889"></textarea>'
    + '<div class="tip">支持公开频道、私有频道（<code>t.me/c/...</code>）、话题群二级链接。<br>'
    + '<b style="color:var(--accent)">✓ 支持下载开启了「限制保存和转发内容（禁止复制转发）」的频道/群聊文件</b>（只要你当前登录账号已加入该频道/群并能看到该消息，即可通过底层 MTProto 数据流直接下载落盘）。</div></div>'
    + '<div class="field"><label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text)">'
    + '<input type="checkbox" id="lkAlbum" checked> 自动包含同相册 / 同组全部媒体（多视频/多图帖只需复制一条链接）</label></div>',
    '<button class="btn" onclick="closeDlg()">取消</button><button class="btn primary" id="lkGo">开始下载</button>', true);
  $('#lkGo').addEventListener('click', function () {
    var btn = $('#lkGo');
    if (btn.disabled) return;
    var lines = $('#lkText').value.split(/\s+/).filter(Boolean);
    var expandAlbum = $('#lkAlbum') ? $('#lkAlbum').checked : true;
    if (!lines.length) { toast('至少填一条链接'); return; }
    btn.disabled = true; btn.textContent = '创建中…';
    var ok = 0, fail = 0, lastJobId = null, p = Promise.resolve();
    lines.forEach(function (link) {
      var peerArg = (!expandAlbum && link.indexOf('?single') < 0) ? (link + '?single') : link;
      p = p.then(function () {
        return api('download.start', { peer: peerArg, ids: [] }).then(function (d) {
          ok++;
          if (d && d.job_id) lastJobId = d.job_id;
        }).catch(function (e) { fail++; toast('失败：' + link + ' · ' + e.message); });
      });
    });
    p.then(function () {
      closeDlg(); toast('已创建 ' + ok + ' 个任务' + (fail ? '，' + fail + ' 个失败' : ''));
      if (lastJobId) { S.taskView = 'job'; S.jobSel = lastJobId; }
      refreshJobs();
    });
  });
}

/* ================= 自动化 ================= */
function renderAuto() {
  var wrap = el('<div class="content">'
    + '<div class="tabs"><button class="tab on">自动规则</button></div>'
    + '<div class="bar"><span class="muted" id="autoRun">0 / 0 条规则正在运行</span><span style="flex:1"></span>'
    + '<button class="btn sm" id="btnAutoStart">' + I.dl + '<span>全部开始</span></button>'
    + '<button class="btn sm" id="btnAutoStop">' + I.stop + '<span>全部停止</span></button>'
    + '<button class="btn primary sm" id="btnAutoNew">' + I.plus + '<span>新建自动下载</span></button></div>'
    + '<div class="body" id="autoBody"></div></div>');
  $('#btnAutoStart', wrap).addEventListener('click', function () { autoAll(true); });
  $('#btnAutoStop', wrap).addEventListener('click', function () { autoAll(false); });
  $('#btnAutoNew', wrap).addEventListener('click', openAutoDialog);
  setTimeout(paintAuto, 0);
  loadAuto();
  return wrap;
}

function paintAuto() {
  var body = $('#autoBody');
  if (!body) return;
  var s = S.autoStats || {};
  var run = $('#autoRun');
  if (run) run.textContent = (s.idle || 0) + ' / ' + (s.total || 0) + ' 条规则正在运行';
  var stats = '<div class="barline">'
    + '<div class="stat"><b>' + (s.total || 0) + '</b><span>规则总数</span></div>'
    + '<div class="stat ok"><b>' + (s.ok || 0) + '</b><span>成功</span></div>'
    + '<div class="stat bad"><b>' + (s.fail || 0) + '</b><span>失败</span></div>'
    + '<div class="stat"><b>' + (s.running || 0) + '</b><span>正在传输</span></div></div>';
  if (!S.rules.length) {
    body.innerHTML = stats + '<div class="empty"><div class="cir">' + I.refresh + '</div><h4>还没有自动规则</h4>'
      + '<p>自动规则开启后会一直监听对话的新消息，符合条件的媒体自动下载到本地。<br>用右上角「新建自动下载」创建第一条。</p></div>';
    return;
  }
  body.innerHTML = stats + '<div class="box" style="margin:0 10px 10px">'
    + '<table class="tbl"><thead><tr><th style="width:24px"></th><th>规则</th><th style="width:120px">对话</th>'
    + '<th style="width:90px">条件</th><th style="width:56px">间隔</th><th style="width:92px">上次运行</th>'
    + '<th style="width:64px">成功/失败</th><th style="width:150px">操作</th></tr></thead><tbody>'
    + S.rules.map(function (r) {
      var itv = r.interval >= 3600 ? Math.round(r.interval / 3600) + ' 时' : r.interval >= 60 ? Math.round(r.interval / 60) + ' 分' : r.interval + ' 秒';
      var cond = (r.kinds || []).map(function (k) { return kindOf(k).t; }).join('/') + (r.min_bytes ? '<br>≥' + bytes(r.min_bytes) : '');
      return '<tr><td><span class="dot" style="background:' + (r.enabled ? 'var(--ok)' : '#a1a1aa') + '"></span></td>'
        + '<td class="nm">' + esc(r.name) + (r.last_error ? ' <span class="tag red" title="' + esc(r.last_error) + '">异常</span>' : '') + '</td>'
        + '<td class="muted">' + esc(r.peer_title || r.peer) + '</td>'
        + '<td class="muted">' + cond + '</td><td class="muted">' + itv + '</td>'
        + '<td class="muted">' + (r.last_run ? fullTime(r.last_run).slice(5) : '—') + '</td>'
        + '<td><span style="color:var(--ok)">' + (r.ok || 0) + '</span> / <span style="color:' + (r.fail ? 'var(--bad)' : 'var(--text3)') + '">' + (r.fail || 0) + '</span></td>'
        + '<td><button class="btn sm" data-tog="' + r.id + '">' + (r.enabled ? '暂停' : '启用') + '</button> '
        + '<button class="btn sm" data-run="' + r.id + '">立即</button> '
        + '<button class="btn sm danger" data-del="' + r.id + '">删除</button></td></tr>';
    }).join('') + '</tbody></table></div>';
  $$('[data-tog]', body).forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.dataset.tog, r = null;
      S.rules.forEach(function (x) { if (x.id === id) r = x; });
      api('auto.update', { id: id, enabled: !r.enabled }).then(loadAuto).catch(function (e) { toast(e.message); });
    });
  });
  $$('[data-run]', body).forEach(function (b) {
    b.addEventListener('click', function () {
      api('auto.run', { id: b.dataset.run }).then(function () { toast('已触发一次扫描'); loadAuto(); })
        .catch(function (e) { toast(e.message); });
    });
  });
  $$('[data-del]', body).forEach(function (b) {
    b.addEventListener('click', function () {
      if (!confirm('删除这条规则？')) return;
      api('auto.delete', { id: b.dataset.del }).then(loadAuto).catch(function (e) { toast(e.message); });
    });
  });
}

function loadAuto() {
  return api('auto.list').then(function (d) {
    S.rules = d.rules || []; S.autoStats = d.stats || {};
  }).catch(function (e) {
    S.autoStats = { error: e.message };
  }).then(paintAuto);
}

function autoAll(enabled) {
  api('auto.all', { enabled: enabled }).then(function () { toast(enabled ? '已全部开始' : '已全部停止'); loadAuto(); })
    .catch(function (e) { toast(e.message); });
}

function openAutoDialog() {
  var paint = function (dialogs) {
    var kinds = ['video', 'image', 'audio', 'file'];
    var initPeer = S.peer || (dialogs[0] && dialogs[0].peer) || '';
    openDlg('新建自动下载规则', '<div class="field"><label>选择对话（显示头像 · 可搜索）</label>'
      + peerPickerHtml('au', dialogs, initPeer)
      + '</div>'
      + '<div class="field"><label>起始下载衔接方式</label>'

  // 从顶栏点进来时直接定位到对应区块，避免「点哪个都是同一个设置页」的困惑
  var FOCUS = { proxy: '#stType', dir: '#fldDir', name: '#fldName' };

    }).then(function () {
      closeDlg(); toast('设置已保存'); refreshStatus();
    }).catch(function (e) { toast(e.message); });
  });
}

/* ---------------- 保存目标文件夹：浏览选择器 ---------------- */
function openBrowseDir(onPick) {
  var state = { path: '', parent: null, dirs: [], roots: [] };

  function render() {
    var crumbs = state.path ? state.path.split('/').filter(Boolean) : [];
    var crumbHtml = crumbs.length
      ? crumbs.map(function (seg, i) {
          var p = '/' + crumbs.slice(0, i + 1).join('/');
          return '<a class="crumb" data-p="' + esc(p) + '">' + esc(seg) + '</a>';
        }).join('<span class="crumbSep">/</span>')
      : '';
    var rootSel = state.roots.length > 1
      ? '<div class="field" style="margin-bottom:8px"><label>选择授权根目录</label><select class="inp" id="brRoot">'
        + state.roots.map(function (r) {
            return '<option value="' + esc(r) + '"' + (r === state.path ? ' selected' : '') + '>' + esc(r) + '</option>';
          }).join('') + '</select></div>'
      : '';

    var rows = state.dirs.map(function (d) {
      return '<div class="browse-row" data-p="' + esc(d.path) + '">'
        + '<span class="browse-ic">' + I.file + '</span>'
        + '<span class="browse-name">' + esc(d.name) + '</span></div>';
    }).join('');

    var body = '<div class="browse-head">'
      + '<button class="btn" id="brUp"' + (state.parent ? '' : ' disabled') + '>↑ 上级</button>'
      + '<span class="browse-path">' + esc(state.path || '（选择一个目录）') + '</span>'
      + '</div>'
      + rootSel
      + '<div class="browse-list">'
      + (rows || '<div class="muted" style="padding:12px">没有子文件夹</div>')
      + '</div>';

    $('#dlgTitle').textContent = '选择保存文件夹';
    $('#dlgBody').innerHTML = body;
    $('#dlgFoot').innerHTML = '<button class="btn" onclick="closeDlg()">取消</button>'
      + '<button class="btn primary" id="brPick">使用此文件夹</button>';
    $('#dlg').classList.remove('wide');
    $('#mask').classList.add('show');

    // 面包屑跳转
    $$('.crumb').forEach(function (a) {
      a.addEventListener('click', function () { load(a.dataset.p); });
    });
    // 上级
    $('#brUp').addEventListener('click', function () { if (state.parent) load(state.parent); });
    // 根切换
    if ($('#brRoot')) $('#brRoot').addEventListener('change', function () { load(this.value); });
    // 子目录进入
    $$('.browse-row').forEach(function (r) {
      r.addEventListener('click', function () { load(r.dataset.p); });
    });
    // 确认
    $('#brPick').addEventListener('click', function () {
      var p = state.path || (state.roots[0] || '');
      if (!p) { toast('请先选择一个目录'); return; }
      closeDlg();
      if (onPick) onPick(p);
      toast('已选择：' + p);
    });
  }

  function load(p) {
    api('files.browse', { path: p || '' }).then(function (d) {
      state.path = d.path; state.parent = d.parent; state.dirs = d.dirs; state.roots = d.roots || [];
      render();
    }).catch(function (e) { toast(e.message); });
  }

  // 用当前输入框里已有的路径作为起点
  var startPath = $('#stDir') ? $('#stDir').value.trim() : '';
  load(startPath);
}

    + '<button class="btn primary" id="lgGo" style="width:100%">登录</button></div>'

  $('#qrPwdGo').addEventListener('click', function () {

  $('#lgSend').addEventListener('click', function () {

      .catch(function (e) { log('发送失败：' + e.message); });

  $('#lgGo').addEventListener('click', function () {
    api('login.code.verify', {
      phone: $('#lgPhoneInp').value.trim(),
      code: $('#lgCode').value.trim(),
      password: $('#lgPwd').value
    }).then(onLoggedIn).catch(function (e) { log('登录失败：' + e.message); });

  var dm = $('#lgDemo');

  var timer = null;

      if (r.authorized) { clearInterval(timer); onLoggedIn(); return; }
      if (r.need_password) { $('#qrPwd').style.display = 'block'; log('需要两步验证密码'); return; }
      if (r.svg) drawQr(r);

/* ================= 状态与事件 ================= */
function refreshStatus() {
  return api('system.status').then(function (d) { S.status = d; renderTop(); })
    .catch(function () { renderTop(); });
}

function connectEvents() {
  var es = new EventSource('/api/events');
  es.onmessage = function (ev) {
    var d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.type === 'job') {
      var idx = -1;
      for (var i = 0; i < S.jobs.length; i++) if (S.jobs[i].job_id === d.job_id) idx = i;
      if (idx >= 0) S.jobs[idx] = d; else S.jobs.unshift(d);
      (d.files || []).forEach(function (f) { if (f && f.id && !f.error) markLocalDone(f.id); });
      if (d.speed && d.state === 'running') S.speeds[d.job_id] = Number(d.speed) || 0;
      else delete S.speeds[d.job_id];
      var jobSpeedSum = 0, hasRunning = false;
      S.jobs.forEach(function (j) {
        if (j.state === 'running') { hasRunning = true; jobSpeedSum += Number(j.speed || S.speeds[j.job_id] || 0); }
      });
      if (jobSpeedSum > 0) { S.down = jobSpeedSum; S.lastSpeedAt = Date.now(); }
      else if (!hasRunning) { S.down = 0; S.downSamples = []; S.taskDone = {}; }
      if (S.page === 'tasks') { paintJobs(); if (S.taskView === 'job' && S.jobSel === d.job_id) paintTaskBody(); }
      renderTop();
    } else if (d.type === 'task') {
      // 下载进度：用 3 秒滑动窗口 + 运行中任务的后端测速共同驱动顶栏 ↓ 速度
      if (d.state === 'running' && d.done != null) {
        var prev = S.taskDone[d.id];
        var cur = Number(d.done) || 0;
        S.taskDone[d.id] = cur;
        var delta = prev == null ? 0 : Math.max(0, cur - prev);
        if (delta > 0) {
          var now = Date.now();
          S.downSamples.push([now, delta]);
          while (S.downSamples.length > 1 && now - S.downSamples[0][0] > 3000) S.downSamples.shift();
          var span = (now - S.downSamples[0][0]) / 1000;
          var winBytes = 0;
          for (var si = 0; si < S.downSamples.length; si++) winBytes += S.downSamples[si][1];
          if (span >= 0.25) S.down = winBytes / span;
          else if (!S.down) S.down = winBytes;
          S.lastSpeedAt = now;
          renderTop();
        }
      } else if (d.state === 'done' || d.state === 'cancelled' || d.state === 'error') {
        delete S.taskDone[d.id];
        if (d.state === 'done' && d.id) markLocalDone(d.id);
      }
    } else if (d.type === 'upload') {
      if (d.state === 'running' && d.speed > 0) {
        S.up = Number(d.speed) || 0;
        S.lastUpAt = Date.now();
      } else if (d.state === 'done') {
        S.up = 0;
      }
      renderTop();
    } else if (d.type === 'transfer') {
      if (!S.transfers) S.transfers = {};
      if (d.state === 'running') {
        S.transfers[d.job_id] = { job_id: d.job_id, ids: d.ids || [], stage: d.stage || '转存中…', state: 'running' };
      } else {
        delete S.transfers[d.job_id];
      }
      if (d.state === 'done') {
        var gone = {};
        (d.ids || []).forEach(function (id) { gone[id] = 1; });
        S.msgs = S.msgs.filter(function (m) { return !gone[m.id]; });
        S.sel = S.sel.filter(function (id) { return !gone[id]; });
        toast('转存完成：已按方案 C（源日期_新消息ID）迁移本地文件并清理我的收藏原消息', 3200);
      } else if (d.state === 'failed') {
        toast('转存失败：' + (d.error || '请打开任务台或日志查看原因'), 3800);
      } else if (d.state === 'cancelled') {
        toast('转存任务已停止（我的收藏原消息已保留）', 2800);
      }
      // 同步更新当前页面上的气泡 DOM（无论是否切换过视图）
      var nodes = $$('.msg[data-tr-job="' + d.job_id + '"]');
      if (!nodes.length && d.ids && d.ids.length) {
        var idSet = {};
        d.ids.forEach(function (id) { idSet[Number(id)] = 1; });
        nodes = $$('.msg[data-ids]').filter(function (n) {
          var nIds = String(n.dataset.ids || '').split(',').map(Number);
          return nIds.some(function (x) { return idSet[x]; });
        });
      }
      nodes.forEach(function (n) {
        var fwBtn = $('[data-saved-fw]', n);
        var delBtn = $('[data-saved-del]', n);
        if (d.state === 'running') {
          n.dataset.trJob = d.job_id;
          if (fwBtn) { fwBtn.disabled = true; fwBtn.textContent = (d.stage || '转存中…').slice(0, 14); }
          if (delBtn) delBtn.disabled = true;
        } else if (d.state === 'done') {
          n.remove();
          updateSelBar();
          var meta = $('#peerMeta');
          if (meta) meta.textContent = S.msgs.length ? (S.msgs.length + (S.hasMore ? '+' : '') + ' 条消息') : '';
        } else if (d.state === 'failed' || d.state === 'cancelled') {
          n.removeAttribute('data-tr-job');
          if (fwBtn) { fwBtn.disabled = false; fwBtn.textContent = d.state === 'failed' ? '重试转发' : '转发'; }
          if (delBtn) delBtn.disabled = false;
        }
      });
    } else if (d.type === 'log') {
      pushLog(d.level || 'info', d.msg || '');
      if ($('#logTableBody')) refreshLogsTable();
    } else if (d.type === 'state') {
      refreshStatus();
    } else if (d.type === 'auto') {
      if (S.page === 'auto') loadAuto();
    }
  };
}

/* 自动夜间模式：根据本地时间 18:00 ~ 次日 06:00 之间自动切夜间，其余日间。
   仅存 localStorage（纯前端偏好，与后端 config 无关）。 */
function isAutoDarkEnabled() {
  try { return localStorage.getItem('tgget_auto_dark') === '1'; } catch (e) { return false; }
}
function setAutoDarkEnabled(on) {
  try { localStorage.setItem('tgget_auto_dark', on ? '1' : '0'); } catch (e) {}
}
function autoDarkTarget() {
  var h = new Date().getHours();
  return h >= 18 || h < 6;   // 18:00~23:59 或 0:00~5:59 → 夜间
}
function tickAutoDark() {
  if (!isAutoDarkEnabled()) return;
  var wantDark = autoDarkTarget();
  var nowDark = document.documentElement.classList.contains('dark');
  if (nowDark !== wantDark) applyTheme(wantDark, false);
}
// 每分钟检查一次，跨过 18:00 / 06:00 边界时自动切换
setInterval(tickAutoDark, 60 * 1000);

$('#btnTheme').addEventListener('click', function () {

  if (isAutoDarkEnabled()) { setAutoDarkEnabled(false); toast('已关闭自动夜间模式'); }
  var nextDark = !document.documentElement.classList.contains('dark');
  applyTheme(nextDark, true);
  toast(nextDark ? '已切换为夜间模式' : '已切换为日间模式');
});

function refreshLogsTable() {

  var cat = ($('#lgFilterCat') && $('#lgFilterCat').value) || 'all';
  var q = ($('#lgFilterQ') && $('#lgFilterQ').value) || '';

    var rows = (d && d.rows) || [];
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center;padding:22px">暂无匹配的持久化日志记录</td></tr>';
      return;
    }
    var LV_TAG = {
      error: '<span class="tag red">错误</span>',
      warn: '<span class="tag" style="background:#fef3c7;color:#b45309">警告</span>',
      ok: '<span class="tag green">成功</span>',
      info: '<span class="tag">信息</span>'
    };
    var CAT_NAME = {
      download: '下载', transfer: '转存', auto: '自动', sync: '同步',
      message: '消息', forward: '转发', settings: '设置', system: '系统'
    };

      var lvHtml = LV_TAG[r.level] || LV_TAG.info;
      var catTxt = CAT_NAME[r.category] || r.category || '系统';

    tbody.innerHTML = '<tr><td colspan="4" style="color:var(--bad);padding:14px">读取日志失败：' + esc(e.message) + '</td></tr>';
  });
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeDlg(); closeViewer(); return; }
  var v = $('#viewer');
  if (v && v.classList.contains('show')) {
    var vid = $('#vwBody video, #vwBody audio');
    if (vid && !e.shiftKey) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); vid.currentTime = Math.max(0, (vid.currentTime || 0) - 5); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); vid.currentTime = Math.min(vid.duration || 1e9, (vid.currentTime || 0) + 5); return; }
      if (e.key === ' ') { e.preventDefault(); if (vid.paused) vid.play(); else vid.pause(); return; }
    }
    if (e.key === 'ArrowLeft') { e.preventDefault(); stepViewer(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepViewer(1); }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomViewerImg(0.35, false); }
    else if (e.key === '-') { e.preventDefault(); zoomViewerImg(-0.35, false); }
    else if (e.key === '0') { e.preventDefault(); zoomViewerImg(0, true); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); rotateViewerImg(); }
  }
});

(function boot() {
  try {
    var z = Number(localStorage.getItem('tgget_zoom'));
    if (z >= 0.5 && z <= 2.5) S.zoom = z;
    if (isAutoDarkEnabled()) {
      applyTheme(autoDarkTarget(), false);   // 自动模式：按当前时间初始化主题
      tickAutoDark();
    } else if (localStorage.getItem('tgget_theme') === 'dark') {
      applyTheme(true, false);
    }
  } catch (e) {}
  applyZoom(false);
  // `?nostream=1` 不连 SSE：截图/无头浏览器里长连接会让页面一直「加载中」，
  // 手动排查问题时也用得上（进度不会自己刷，按刷新按钮即可）
  var noStream = /[?&]nostream=1/.test(location.search);
  // `?page=tasks` / `?page=auto` 直接落到对应页面，方便收藏地址或截图
  var pageParam = /[?&]page=(chat|tasks|auto)/.exec(location.search);
  if (pageParam && pageParam[1] !== 'chat') setTimeout(function () { go(pageParam[1]); }, 0);
  // `?job=<任务号>` 直接展开某个任务的详情
  var jobParam = /[?&]job=([0-9a-zA-Z]{4,16})/.exec(location.search);
  if (jobParam) { S.taskView = 'job'; S.jobSel = jobParam[1]; }
  refreshStatus().then(function () {
    render();
    if (!noStream) connectEvents();
    if (!(S.status && S.status.telegram && S.status.telegram.authorized)) {
      if (S.status && S.status.demo) toast('演示模式：点左上角账号可以模拟登录', 4000);
      else setTimeout(openLogin, 600);
    } else {
      loadDialogs().then(function () {
        // `?peer=<peer>` 直接打开某个对话（收藏地址用）
        var pp = /[?&]peer=([-\w@.+%]{1,120})/.exec(location.search);
        if (pp) selectPeer(decodeURIComponent(pp[1]));
      });
    }
    setInterval(refreshStatus, 15000);
    // 相册是按窗口宽度算像素坐标的，窗口尺寸变了要重排
    var rzTimer = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rzTimer);
      rzTimer = setTimeout(function () {
        if (S.viewMode === 'text' && S.msgs.length) paintMedia(false);
      }, 250);
    });
    setInterval(function () {
      var now = Date.now(), dirty = false;
      if (S.down > 0 && now - (S.lastSpeedAt || 0) > 4500) {
        S.down = 0; S.downSamples = []; S.speeds = {}; dirty = true;
      }
      if (S.up > 0 && now - (S.lastUpAt || 0) > 4500) {
        S.up = 0; dirty = true;
      }
      if (dirty) renderTop();
    }, 1500);
  });
})();
</script>
