<script>
const TOKEN_NEEDED = {{TOKEN_NEEDED}};
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

const S = {
  page: 'chat',
  status: null,
  dialogs: [], dlgLoading: false, dlgPromise: null, dlgQuery: '', dlgCached: false,
  peer: null, peerTitle: '', peerKind: '', msgs: [], sel: [], mediaLoading: false,
  viewMode: 'media', hasMore: false, nextOffset: 0, loadingMore: false,
  cacheHit: false, offline: false,
  pageSize: 60, showPanel: true, zoom: 1, jumpTo: null,
  jobs: [], jobSel: null, jobFilter: 'all', jobQuery: '', taskView: 'new',
  rules: [], autoStats: {},
  speeds: {}, lastSpeedAt: 0, lastUpAt: 0, up: 0, down: 0, taskDone: {}, downSamples: [],
  logs: [], lastTaskDone: 0,
};

/* ---------------- 工具 ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function bytes(n) {
  n = Number(n || 0);
  if (!n) return '0 B';
  var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
}
function toDate(t) {
  if (!t) return null;
  if (typeof t === 'number') return new Date(t * 1000);
  var d = new Date(t);
  return isNaN(d.getTime()) ? null : d;
}
function pad(n) { return String(n).padStart(2, '0'); }
function timeStr(t) {
  var d = toDate(t); if (!d) return '';
  var now = new Date();
  if (d.toDateString() === now.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function fullTime(t) {
  var d = toDate(t); if (!d) return '';
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
var KIND = {
  video: { t: '视频', c: '#2563eb' }, photo: { t: '图片', c: '#16a34a' }, image: { t: '图片', c: '#16a34a' },
  audio: { t: '音频', c: '#7c3aed' }, voice: { t: '语音', c: '#7c3aed' }, sticker: { t: '贴纸', c: '#db2777' },
  file: { t: '文件', c: '#64748b' }, text: { t: '文本', c: '#a1a1aa' }, dir: { t: '文件夹', c: '#b45309' }
};
function kindOf(k) { return KIND[k] || KIND.file; }

var I = {
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5.5-5 4 3.5L17 13l3.5 3"/></svg>',
  audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/></svg>',
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7L11.5 7"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 1 0 11 18.7L12.5 17"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 12l16-8-6 16-3-6z"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.5v13l11-6.5z"/></svg>'
};

/* ---------------- RPC ---------------- */
function api(action, payload) {
  return fetch('/api/actions/execute', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: action, payload: payload || {} })
  }).then(function (r) {
    if (r.status === 401) { openTokenDialog(); throw new Error('需要访问令牌'); }
    return r.json().catch(function () { return { ok: false, error: '响应无法解析' }; });
  }).then(function (j) {
    if (!j.ok) throw new Error(j.error || '调用失败');
    return j.data;
  });
}
function toast(msg, ms) {
  var t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 2200);
}
function pushLog(level, msg) {
  S.logs.unshift({ level: level, msg: msg, ts: Date.now() });
  S.logs = S.logs.slice(0, 100);
}

/* ---------------- 弹层 ---------------- */
function openDlg(title, body, foot, wide) {
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = body;
  $('#dlgFoot').innerHTML = foot || '';
  $('#dlg').classList.toggle('wide', !!wide);
  $('#mask').classList.add('show');
}
function closeDlg() { $('#mask').classList.remove('show'); }

/* ---------------- 顶栏 ---------------- */
function renderTop() {
  var st = S.status;
  if (!st) return;
  $('#ver').textContent = st.version || '';
  var tg = st.telegram || {};
  var u = tg.user;
  $('#acctText').textContent = tg.authorized
    ? ((u && u.name) || '已登录') + (u && u.username ? ' @' + u.username : '')
    : (st.demo ? '演示模式 · 未登录' : '未登录');
  var p = st.proxy || (st.config && st.config.proxy) || '';
  $('#netText').textContent = p ? p.replace(/\/\/[^@]*@/, '//***@') : '未设置代理';
  $('#diskText').textContent = (st.disk && st.disk.text) || '—';
  var on = !!tg.connected;
  $('#netDot').className = 'dot' + (on ? '' : (tg.error ? ' bad' : ' off'));
  $('#netState').textContent = on ? '连接正常' : (tg.error ? '连接失败' : '未连接');
  $('#netState').className = 'v ' + (on ? 'ok' : 'bad');
  $('#speedText').textContent = '↑ ' + bytes(S.up) + '/s  ↓ ' + bytes(S.down) + '/s';
}

/* ---------------- 页面 ---------------- */
var PAGES = { chat: renderChat, tasks: renderTasks, auto: renderAuto };
function go(page) {
  S.page = page;
  $$('#rail button').forEach(function (b) { b.classList.toggle('on', b.dataset.page === page); });
  render();
}
function render() {
  var main = $('#main');
  main.innerHTML = '';
  main.appendChild(PAGES[S.page]());
  renderTop();
}
function el(html) {
  var d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

/* ================= 对话 ================= */
function renderChat() {
  var wrap = el('<div class="shell" id="chatShell"></div>');
  var panel = el('<aside class="panel" id="chatPanel">'
    + '<div class="panel-hd"><span class="ttl">对话</span>'
    + '<span class="caps" id="viewCaps"><button data-v="media">媒体</button><button data-v="text">消息</button></span>'
    + '<span class="cnt" id="dlgCnt">0</span>'
    + '<span style="flex:1"></span><button class="iconbtn" id="btnDlgRefresh" title="重新同步">' + I.refresh + '</button></div>'
    + '<div class="panel-search"><input class="inp" id="dlgSearch" placeholder="搜索对话"></div>'
    + '<div class="panel-body" id="dlgList"></div></aside>');
  var content = el('<div class="content">'
    + '<div class="bar"><button class="btn sm only-mob" id="btnBackPanel">‹ 对话</button>'
    + '<span id="peerAv"></span>'
    + '<span id="peerTitle" style="font-size:12px;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">未选择对话</span>'
    + '<span id="syncHint" style="display:none;font-size:10px;color:var(--text3);flex:none"></span><span id="savedTargetPill" class="tag teal" style="display:none;cursor:pointer" title="点击修改「我的收藏」一键转发的目标群组"></span>'
    + '<span class="muted" id="peerMeta" style="font-size:11px"></span>'
    + '<span class="spacer"></span>'
    + '<span class="selbar" id="selBar"></span>'
    + '<span class="zoomx" id="zoomBox" title="调整媒体视图大小">'
    + '<button class="btn sm" id="zoomOut">−</button><span id="zoomVal">100%</span>'
    + '<button class="btn sm" id="zoomIn">＋</button></span>'
    + '<button class="btn sm" id="btnSelAll">全选</button>'
    + '<button class="btn sm" id="btnSelNone">清空</button>'
    + '<button class="btn sm" id="btnReloadMedia">' + I.refresh + '<span>刷新</span></button>'
    + '<button class="btn sm" id="btnForward" disabled>' + I.send + '<span>转发</span></button>'
    + '<button class="btn sm" id="btnExport" disabled>' + I.file + '<span>导出</span></button>'
    + '<button class="btn sm danger" id="btnDelete" disabled>' + I.trash + '<span>删除</span></button>'
    + '<button class="btn primary sm" id="btnDownload" disabled>' + I.dl + '<span id="dlLabel">下载选中</span></button>'
    + '</div><div class="body" id="chatBody"></div></div>');
  wrap.appendChild(panel); wrap.appendChild(content);

  $('#viewCaps', panel).addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (b && b.dataset.v !== S.viewMode) switchView(b.dataset.v);
  });
  $('#dlgSearch', panel).value = S.dlgQuery;
  $('#dlgSearch', panel).addEventListener('input', function (e) { S.dlgQuery = e.target.value; paintDialogs(); });
  $('#btnDlgRefresh', panel).addEventListener('click', function () { loadDialogs(true); });
  $('#btnBackPanel', content).addEventListener('click', function () {
    wrap.classList.remove('mob-detail');
  });
  $('#btnSelAll', content).addEventListener('click', toggleSelectAll);
  $('#btnSelNone', content).addEventListener('click', function () { S.sel = []; updateSelBar(); });
  $('#btnReloadMedia', content).addEventListener('click', function () { if (S.peer) loadMedia(S.peer, true); });
  $('#btnDownload', content).addEventListener('click', downloadSelected);
  $('#btnForward', content).addEventListener('click', openForwardDialog);
  $('#btnExport', content).addEventListener('click', openExportDialog);
  $('#btnDelete', content).addEventListener('click', openDeleteDialog);
  $('#zoomIn', content).addEventListener('click', function () { zoomStep(1); });
  $('#zoomOut', content).addEventListener('click', function () { zoomStep(-1); });

  // 事件委托：paint 时只换 innerHTML，不必每次重新绑一堆监听
  var body = $('#chatBody', content);
  body.addEventListener('click', onChatBodyClick);
  body.addEventListener('scroll', onChatScroll, { passive: true });

  setTimeout(function () {
    paintDialogs();
    paintViewCaps();
    paintMedia();
    if (S.peer) wrap.classList.add('mob-detail');
  }, 0);
  if (!S.dialogs.length) loadDialogs();
  return wrap;
}

function paintViewCaps() {
  $$('#viewCaps button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.v === S.viewMode);
  });
  var zb = $('#zoomBox');
  if (zb) zb.style.display = S.viewMode === 'media' ? 'inline-flex' : 'none';
  var v = $('#zoomVal');
  if (v) v.textContent = Math.round(S.zoom * 100) + '%';
}

/* 媒体网格缩放：改 --zoom，网格列宽与缩略图高度一起等比缩放 */
var ZOOMS = [0.6, 0.75, 0.9, 1, 1.15, 1.35, 1.6, 2];
function applyZoom(save) {
  document.documentElement.style.setProperty('--zoom', String(S.zoom));
  var v = $('#zoomVal');
  if (v) v.textContent = Math.round(S.zoom * 100) + '%';
  if (save) { try { localStorage.setItem('tgget_zoom', String(S.zoom)); } catch (e) {} }
}
function zoomStep(dir) {
  var best = 0;
  for (var i = 1; i < ZOOMS.length; i++) {
    if (Math.abs(ZOOMS[i] - S.zoom) < Math.abs(ZOOMS[best] - S.zoom)) best = i;
  }
  var next = Math.min(ZOOMS.length - 1, Math.max(0, best + dir));
  S.zoom = ZOOMS[next];
  applyZoom(true);
}

function switchView(mode) {
  S.viewMode = mode;
  paintViewCaps();
  // 两种视图要的数据不一样：媒体视图只取带附件的，消息视图要全部
  if (S.peer) loadMedia(S.peer, true); else paintMedia();
}

function paintDialogs() {
  var box = $('#dlgList');
  if (!box) return;
  var q = S.dlgQuery.trim().toLowerCase();
  var rows = S.dialogs.filter(function (d) {
    return !q || (d.title || '').toLowerCase().indexOf(q) >= 0 || (d.username || '').toLowerCase().indexOf(q) >= 0;
  });
  var cnt = $('#dlgCnt'); if (cnt) cnt.textContent = S.dialogs.length;
  if (S.dlgLoading && !S.dialogs.length) { box.innerHTML = '<div class="empty-sm">正在同步对话…</div>'; return; }
  if (!rows.length) {
    box.innerHTML = '<div class="empty-sm">' + (S.dialogs.length ? '没有匹配的对话' : '还没有对话<br>登录后会自动同步') + '</div>';
    return;
  }
  box.innerHTML = rows.map(function (d) {
    var saved = d.kind === 'saved';
    var un = d.unread ? '<span class="un">' + (d.unread > 99 ? '99+' : d.unread) + '</span>' : '';
    var sub = d.preview || (saved ? '保存给自己的消息' : d.kind === 'channel' ? '频道' : d.kind === 'group' ? '群组' : '用户');
    return '<div class="row' + (String(d.peer) === String(S.peer) ? ' on' : '') + '" data-peer="' + esc(d.peer) + '">'
      + avHtml(d.kind, d.peer, d.title, d.has_photo, 'av')
      + '<span class="mid"><span class="nm">' + esc(d.title) + '</span><span class="sub">' + esc(sub) + '</span></span>'
      + '<span class="rt"><span class="tm">' + (saved ? '' : timeStr(d.date)) + '</span>' + un + '</span></div>';
  }).join('');
  $$('.row', box).forEach(function (r) {
    r.addEventListener('click', function () { selectPeer(r.dataset.peer); });
  });
  paintPeerHead();
}

/* 顶部「当前对话」的标题 + 头像，跟着选中的对话走 */
function isSavedChat() {
  return S.peerKind === 'saved' || S.peerTitle === '我的收藏';
}

function resolveArchiveTarget() {
  var cfg = (S.status && S.status.config) || {};
  var p = String(cfg.archive_peer || '').trim();
  var t = String(cfg.archive_title || '').trim();
  if (p) {
    for (var i = 0; i < S.dialogs.length; i++) {
      if (String(S.dialogs[i].peer) === p) { t = S.dialogs[i].title || t; break; }
    }
    return { peer: p, title: t || p };
  }
  // 若尚未手动配置，自动在对话列表里找名为「春风春色」的群组并取其数字 ID
  for (var j = 0; j < S.dialogs.length; j++) {
    if ((S.dialogs[j].title || '').indexOf('春风春色') >= 0) {
      return { peer: String(S.dialogs[j].peer), title: S.dialogs[j].title };
    }
  }
  return { peer: '', title: '' };
}

function paintPeerHead() {
  var d = null;
  for (var i = 0; i < S.dialogs.length; i++) if (String(S.dialogs[i].peer) === String(S.peer)) d = S.dialogs[i];
  var t = $('#peerTitle');
  if (t) t.textContent = d ? d.title : (S.peer ? S.peerTitle : '未选择对话');
  var pa = $('#peerAv'); if (pa) pa.innerHTML = d ? avHtml(d.kind, d.peer, d.title, d.has_photo, 'peerav') : '';
  var pill = $('#savedTargetPill');
  if (pill) {
    if (isSavedChat()) {
      var tgt = resolveArchiveTarget();
      pill.style.display = 'inline-flex';
      pill.textContent = tgt.peer ? ('转存至：' + tgt.title + ' (' + tgt.peer + ') ⚙') : '设置转存目标群 ⚙';
      pill.onclick = function () { openArchiveTargetDialog(); };
    } else {
      pill.style.display = 'none';
    }
  }
}

function loadDialogs(force) {
  // 同一时刻只发一次请求：页面渲染和启动脚本都会调它，第二次直接复用
  // 正在跑的那个 Promise —— 否则会立刻 resolve，调用方拿到的还是空列表
  if (!force && S.dlgPromise) return S.dlgPromise;
  if (S.dlgLoading && !force) return S.dlgPromise || Promise.resolve();
  S.dlgLoading = true; paintDialogs();
  // 同样是本地优先：断网时左侧栏还能点开对话，只是没有新内容
  var p = api('dialog.list', { limit: 200, source: 'local' }).then(function (d) {
    if ((d.rows || []).length) {
      S.dialogs = d.rows;
      S.dlgCached = true;
      paintDialogs();
    }
  }).catch(function () {}).then(function () {
    return api('dialog.list', { limit: 200 }).then(function (d) {
      S.dialogs = d.rows || [];
      S.dlgCached = false;
    }).catch(function (e) {
      if (!S.dlgCached) toast('同步对话失败：' + e.message);
    });
  }).then(function () {
    S.dlgLoading = false; S.dlgPromise = null; paintDialogs();
  });
  S.dlgPromise = p;
  return p;
}

function selectPeer(peer) {
  var d = null;
  for (var i = 0; i < S.dialogs.length; i++) if (String(S.dialogs[i].peer) === String(peer)) d = S.dialogs[i];
  S.peer = String(peer);
  S.peerTitle = (d && d.title) || String(peer);
  S.peerKind = (d && d.kind) || '';
  S.msgs = []; S.sel = [];
  S.hasMore = false; S.nextOffset = 0; S.loadingMore = false;
  paintDialogs();
  var t = $('#peerTitle'); if (t) t.textContent = S.peerTitle;
  var shell = $('#chatShell'); if (shell) shell.classList.add('mob-detail');
  loadMedia(S.peer);
}

/* ---------------- 消息读取：首屏 + 增量 ---------------- */
function loadMedia(peer, force) {
  S.mediaLoading = true;
  S.loadingMore = false;
  S.msgs = []; S.sel = [];
  S.cacheHit = false;
  paintMedia(true);
  var wantMedia = S.viewMode === 'media';
  var base = { peer: peer, limit: S.pageSize, media_only: wantMedia, offset_id: 0 };

  // 先读本地库：毫秒级出画面，断网也有内容。再后台去 Telegram 补，
  // 补不到就保持本地那份，不弹错误 —— 这就是「本地优先，后台补」。
  return api('message.list', Object.assign({ source: 'local' }, base)).then(function (d) {
    if (String(peer) !== String(S.peer)) return false;
    if ((d.rows || []).length) {
      S.msgs = (d.rows || []).slice();
      dedupeMsgs();
      S.hasMore = !!d.has_more;
      S.nextOffset = d.next_offset || 0;
      S.cacheHit = true;
      S.mediaLoading = false;
      setSyncHint('本地缓存 · 同步中', false);
      paintMedia(true);
    }
    return true;
  }).catch(function () { return true; }).then(function (ok) {
    if (!ok) return;
    return api('message.list', base).then(function (d) {
      if (String(peer) !== String(S.peer)) return;
      S.msgs = (d.rows || []).slice();
      dedupeMsgs();
      S.hasMore = !!d.has_more;
      S.nextOffset = d.next_offset || 0;
      S.offline = false;
      S.cacheHit = false;
      var remCnt = (d.removed_ids && d.removed_ids.length) || 0;
      if (remCnt > 0) {
        setSyncHint('已同步移除云端已删消息 ' + remCnt + ' 条', false);
        setTimeout(function () { setSyncHint('', false); }, 3500);
      } else {
        setSyncHint('', false);
      }
    }).catch(function (e) {
      // 有本地内容就别打扰用户；一片空白时才是真的失败
      S.offline = S.cacheHit;
      if (S.cacheHit) {
        setSyncHint('离线 · 显示本地缓存', true);
      } else {
        setSyncHint('', false);
        toast('读取消息失败：' + e.message);
      }
    });
  }).then(function () {
    S.mediaLoading = false;
    paintMedia(true);
  });
}

function setSyncHint(txt, warn) {
  var el = $('#syncHint');
  if (!el) return;
  el.textContent = txt || '';
  el.style.display = txt ? '' : 'none';
  el.style.color = warn ? '#b45309' : 'var(--text3)';
}

function loadMore() {
  if (!S.peer || S.loadingMore || !S.hasMore || S.mediaLoading) return Promise.resolve(0);
  S.loadingMore = true;
  paintMoreHint();
  var peer = S.peer, mode = S.viewMode;
  var body = $('#chatBody');
  var anchorTop = body ? body.scrollTop : 0;
  var anchorH = body ? body.scrollHeight : 0;
  var base = { peer: peer, limit: S.pageSize, media_only: mode === 'media', offset_id: S.nextOffset };

  function merge(d, fromLocal) {
    if (String(peer) !== String(S.peer) || mode !== S.viewMode) return 0;
    var have = {};
    S.msgs.forEach(function (m) { have[m.id] = 1; });
    var addedRows = [];
    (d.rows || []).forEach(function (m) {
      if (!have[m.id]) { have[m.id] = 1; S.msgs.push(m); addedRows.push(m); }
    });
    dedupeMsgs();
    // 本地缓存到底并不代表 Telegram 云端也没更早的消息：只要在线，就保留 hasMore 让下一次滚动回源拉取
    S.hasMore = (fromLocal && !S.offline) ? true : !!d.has_more;
    S.nextOffset = d.next_offset || S.nextOffset;
    S.loadingMore = false;
    if (mode === 'media' && addedRows.length && $('#chatBody .grid')) {
      appendGridCards(addedRows);
    } else {
      paintMedia(false, anchorTop, anchorH, addedRows.length);
    }
    return addedRows.length;
  }

  // 在线时优先拉取 Telegram 云端并同步校准已删消息；断网失败时再退回本地 SQLite 缓存
  if (!S.offline) {
    return api('message.list', base).then(function (r) {
      if (r.removed_ids && r.removed_ids.length) {
        var goneMap = {};
        r.removed_ids.forEach(function (id) { goneMap[id] = 1; });
        S.msgs = S.msgs.filter(function (m) { return !goneMap[m.id]; });
      }
      return merge(r, false);
    }).catch(function () {
      return api('message.list', Object.assign({ source: 'local' }, base)).then(function (d) {
        return merge(d, true);
      });
    }).catch(function (e) {
      S.loadingMore = false;
      if (!S.cacheHit) toast('加载更多失败：' + e.message);
      paintMoreHint();
      return 0;
    });
  }
  return api('message.list', Object.assign({ source: 'local' }, base)).then(function (d) {
    return merge(d, true);
  }).catch(function (e) {
    S.loadingMore = false;
    if (!S.cacheHit) toast('加载更多失败：' + e.message);
    paintMoreHint();
    return 0;
  });
}

function dedupeMsgs() {
  var seen = {}, out = [];
  S.msgs.forEach(function (m) { if (!seen[m.id]) { seen[m.id] = 1; out.push(m); } });
  out.sort(function (a, b) { return Number(b.id) - Number(a.id); });
  S.msgs = out;
}

/* ---------------- 媒体卡片 → 消息定位 ---------------- */
function jumpToMessage(id) {
  if (!S.peer) return;
  S.jumpTo = id;
  if (S.viewMode !== 'text') { S.viewMode = 'text'; paintViewCaps(); }
  toast('正在定位到消息…');
  loadMedia(S.peer, true).then(function () { seekMessage(id, 0); });
}

// 消息视图是「一页页往前翻」的：目标不在本页就继续翻，最多翻 60 页（约 3600 条）
function seekMessage(id, tries) {
  if (!S.peer || S.jumpTo == null) return;
  if (msgById(id)) { S.jumpTo = null; scrollToMsg(id); return; }
  if (!S.hasMore || tries > 60) {
    S.jumpTo = null;
    toast('这条消息比已缓存的更早，继续上滑加载后再点一次');
    return;
  }
  loadMore().then(function () {
    if (S.jumpTo == null) return;
    if (msgById(id)) { S.jumpTo = null; scrollToMsg(id); return; }
    setTimeout(function () { seekMessage(id, tries + 1); }, 0);
  });
}

function scrollToMsg(id) {
  var nodes = $$('.msg[data-ids]');
  var target = null;
  for (var i = 0; i < nodes.length && !target; i++) {
    var ids = nodes[i].dataset.ids.split(',').map(Number);
    if (ids.indexOf(Number(id)) >= 0) target = nodes[i];
  }
  if (!target) { toast('已切到消息视图，但这条不在当前页'); return; }
  target.scrollIntoView({ block: 'center' });
  target.classList.add('flash');
  setTimeout(function () { target.classList.remove('flash'); }, 2200);
  toast('已定位到这条消息 · 点左上「媒体」可切回网格');
}

function onChatScroll() {
  var body = $('#chatBody');
  if (!body) return;
  if (S.viewMode === 'text') {
    // 气泡是从旧到新排的，往上滚才是更早的消息
    if (body.scrollTop < 260) loadMore();
  } else if (body.scrollTop + body.clientHeight > body.scrollHeight - 420) {
    loadMore();
  }
}

function onChatBodyClick(e) {
  var sfw = e.target.closest('[data-saved-fw]');
  if (sfw) {
    e.stopPropagation();
    var mNode = sfw.closest('[data-ids]');
    if (mNode) handleSavedTransfer(mNode, sfw);
    return;
  }
  var sdel = e.target.closest('[data-saved-del]');
  if (sdel) {
    e.stopPropagation();
    var dNode = sdel.closest('[data-ids]');
    if (dNode) handleSavedDiscard(dNode, sdel);
    return;
  }
  var play = e.target.closest('[data-play]');
  if (play && play.dataset.id) { openViewer(Number(play.dataset.id)); return; }
  var jump = e.target.closest('[data-jump]');
  if (jump) {
    var jc = jump.closest('[data-id]');
    if (jc) { jumpToMessage(Number(jc.dataset.id)); return; }
  }
  if (e.target.closest('[data-cb]')) {
    var c = e.target.closest('[data-ids]') || e.target.closest('[data-id]');
    if (c) {
      if (c.dataset.ids) toggleGroup(c.dataset.ids);
      else toggleSel(Number(c.dataset.id));
    }
    return;
  }
  if (S.viewMode === 'text') {
    var m = e.target.closest('[data-ids]');
    if (m) toggleGroup(m.dataset.ids);
    return;
  }
  var card = e.target.closest('[data-id]');
  if (card) openViewer(Number(card.dataset.id));
}

function msgById(id) {
  for (var i = 0; i < S.msgs.length; i++) if (Number(S.msgs[i].id) === Number(id)) return S.msgs[i];
  return null;
}

function toggleSel(id) {
  var i = S.sel.indexOf(id);
  if (i >= 0) S.sel.splice(i, 1); else S.sel.push(id);
  updateSelBar();
}

// 勾选一整条消息：相册气泡的 data-ids 是「id1,id2,id3」，要整组一起选中
function toggleGroup(idsStr) {
  var ids = String(idsStr).split(',').map(Number).filter(function (n) { return n; });
  if (!ids.length) return;
  var allOn = ids.every(function (id) { return S.sel.indexOf(id) >= 0; });
  ids.forEach(function (id) {
    var i = S.sel.indexOf(id);
    if (allOn) { if (i >= 0) S.sel.splice(i, 1); }
    else if (i < 0) S.sel.push(id);
  });
  updateSelBar();
}

function toggleSelectAll() {
  var allOn = S.msgs.length > 0 && S.msgs.every(function (m) { return S.sel.indexOf(m.id) >= 0; });
  S.sel = allOn ? [] : S.msgs.map(function (m) { return m.id; });
  updateSelBar();
  toast(allOn ? '已取消全选' : ('已全选 ' + S.sel.length + ' 条'));
}

function updateSelBar() {
  var btn = $('#btnDownload');
  if (btn) {
    btn.disabled = !S.sel.length;
    var lb = $('#dlLabel');
    if (lb) lb.textContent = S.sel.length ? '下载 (' + S.sel.length + ')' : '下载选中';
  }
  ['#btnForward', '#btnExport', '#btnDelete'].forEach(function (sel) {
    var b = $(sel); if (b) b.disabled = !S.sel.length;
  });
  var allOn = S.msgs.length > 0 && S.msgs.every(function (m) { return S.sel.indexOf(m.id) >= 0; });
  var sa = $('#btnSelAll');
  if (sa) sa.textContent = allOn ? '取消全选' : '全选';
  var bar = $('#selBar');
  if (bar) {
    var total = 0, picked = 0;
    S.msgs.forEach(function (m) {
      if (S.sel.indexOf(m.id) < 0) return;
      picked++;
      total += Number(m.size || 0);
    });
    bar.innerHTML = S.sel.length ? '已选 <b>' + picked + '</b> 条 · ' + bytes(total) : '';
  }
  $$('.card, .msg').forEach(function (c) {
    if (c.dataset.ids) {
      var ids = c.dataset.ids.split(',').map(Number);
      var allOn = ids.length > 0 && ids.every(function (id) { return S.sel.indexOf(id) >= 0; });
      c.classList.toggle('on', allOn);
    } else {
      c.classList.toggle('on', S.sel.indexOf(Number(c.dataset.id)) >= 0);
    }
  });
}

/* ---------------- 渲染 ---------------- */
function paintMedia(reset, anchorTop, anchorH, added) {
  var body = $('#chatBody');
  if (!body) return;
  var keepTop = body.scrollTop;
  var keepH = body.scrollHeight;
  updateSelBar();
  var meta = $('#peerMeta');
  if (meta) meta.textContent = S.msgs.length ? (S.msgs.length + (S.hasMore ? '+' : '') + (S.viewMode === 'text' ? ' 条消息' : ' 个媒体')) : '';

  if (!S.peer) {
    body.innerHTML = '<div class="empty"><div class="cir">' + I.chat + '</div><h4>请选择一个对话</h4>'
      + '<p>从左侧列表中选择一个对话，右侧会列出该对话的图片、视频和文件。<br>'
      + '点卡片直接在线播放，点左上角的小方框是勾选。</p></div>';
    return;
  }
  if (S.mediaLoading && !S.msgs.length) {
    body.innerHTML = '<div class="empty"><div class="spin"></div><p>正在读取…</p></div>';
    return;
  }
  if (!S.msgs.length) {
    body.innerHTML = '<div class="empty"><div class="cir">' + I.file + '</div><h4>这里还没有内容</h4>'
      + '<p>' + (S.viewMode === 'text' ? '这个对话还没有可显示的消息。' : '这个对话没有可下载的媒体，切到「消息」看看文字内容。') + '</p></div>';
    return;
  }
  if (S.viewMode === 'text') paintTextInner(body);
  else paintGridInner(body);

  if (reset) {
    if (S.viewMode === 'text') body.scrollTop = body.scrollHeight;
    else body.scrollTop = 0;
  } else if (S.viewMode === 'text') {
    // 往上加载历史：把滚动位置跟着内容一起下移，视觉上不跳
    body.scrollTop = (anchorTop || 0) + (body.scrollHeight - (anchorH || keepH));
  } else {
    body.scrollTop = keepTop;
  }
}

/* 计算每个消息的分组颜色索引。
   只有「同 grouped_id 下成员数 >= 2」的真多图相册才分配颜色（单张/孤立 grouped_id 不圈），
   颜色按相册出现顺序循环，相邻相册自动异色。返回 { id: colorIndex } 的 Map。 */
function groupColorMap(msgs) {
  var map = {};
  var counts = {};
  msgs.forEach(function (m) {
    if (m.grouped_id && m.has_media) counts[m.grouped_id] = (counts[m.grouped_id] || 0) + 1;
  });
  var ci = 0;
  var gidColor = {};
  msgs.forEach(function (m) {
    if (m.grouped_id && counts[m.grouped_id] >= 2) {
      if (!(m.grouped_id in gidColor)) { gidColor[m.grouped_id] = ci++; }
      map[m.id] = gidColor[m.grouped_id];
    }
  });
  return map;
}

var ALBUM_COLORS = [
  '#3b82f6', // 蓝
  '#f59e0b', // 橙
  '#22c55e', // 绿
  '#a855f7', // 紫
  '#ec4899', // 粉
  '#14b8a6', // 青
  '#ef4444', // 红
  '#8b5cf6'  // 蓝紫
];

function cardHtml(m, gidx) {
  var on = S.sel.indexOf(m.id) >= 0;
  var k = kindOf(m.kind);
  var ic = iconFor(m.kind);
  var play = overlayKind(m.kind);
  var name = m.filename || (k.t + ' #' + m.id);
  var tip = [];
  if (m.save_name) tip.push('保存为：' + m.save_name);
  tip.push('大小 ' + bytes(m.size) + ' · ' + fullTime(m.date));
  tip.push('点缩略图播放，点下面的名字在消息里定位');
  var grp = (typeof gidx === 'number' && gidx >= 0)
    ? ' data-grp="' + gidx + '" style="--grp:' + ALBUM_COLORS[gidx % ALBUM_COLORS.length] + '"'
    : '';
  return '<div class="card' + (on ? ' on' : '') + '" data-id="' + m.id + '"' + grp + '>'
    + '<div class="thumb" data-play="1" style="color:' + k.c + '">' + ic
    + (hasThumb(m.kind)
      ? '<img loading="lazy" decoding="async" alt="" src="' + thumbUrl(S.peer, m.id) + '" onerror="this.remove()">'
      : '')
    + (play ? '<span class="play">' + I.play + '</span>' : '')
    + (m.duration ? '<span class="dur">' + durStr(m.duration) + '</span>' : '')
    + (m.local ? '<span class="locmark" title="已下载到本地，播放走磁盘">·</span>' : '')
    + '</div>'
    + '<div class="meta" data-jump="1" title="' + esc(tip.join('\n')) + '">'
    + '<span class="fn">' + esc(name) + '</span>'
    + (Number(m.size) ? '<span class="z">' + bytes(m.size) + '</span>' : '')
    + '</div>'
    + '<div class="cb" data-cb="1">' + I.check + '</div></div>';
}

function paintGridInner(body) {
  var cmap = groupColorMap(S.msgs);
  body.innerHTML = '<div class="grid">' + S.msgs.map(function (m) { return cardHtml(m, cmap[m.id]); }).join('') + moreHtml(false) + '</div>';
}

/* 增量追加卡片：下拉翻页时只把新拿到的卡片插进 .grid，不销毁已有 DOM 与已加载的缩略图 */
function appendGridCards(rows) {
  var grid = $('#chatBody .grid');
  if (!grid) return;
  rows.sort(function (a, b) { return Number(b.id) - Number(a.id); });
  // 重新计算全量分组颜色，保证翻页追加的卡片与已有卡片颜色一致
  var cmap = groupColorMap(S.msgs);
  var html = rows.map(function (m) { return cardHtml(m, cmap[m.id]); }).join('');
  var moreEl = $('.loadmore', grid);
  if (moreEl) moreEl.insertAdjacentHTML('beforebegin', html);
  else grid.insertAdjacentHTML('beforeend', html);
  paintMoreHint();
  updateSelBar();
  var meta = $('#peerMeta');
  if (meta) meta.textContent = S.msgs.length ? (S.msgs.length + (S.hasMore ? '+' : '') + ' 个媒体') : '';
}

function paintTextInner(body) {
  var rows = S.msgs.slice().sort(function (a, b) { return Number(a.id) - Number(b.id); });
  // 相册合并：同 grouped_id 的多张图/视频是「一条消息」，合成一个气泡
  var items = [];
  var albumMap = {};
  rows.forEach(function (m) {
    if (m.grouped_id && m.has_media) {
      var g = albumMap[m.grouped_id];
      if (!g) {
        g = { kind: 'album', media: [], text: '', sender: m.sender, out: m.out, date: m.date, ids: [] };
        albumMap[m.grouped_id] = g;
        items.push(g);
      }
      g.media.push(m);
      g.ids.push(m.id);
      if (m.text) g.text = m.text;   // 相册的说明文字（caption）通常只在其中一条上
      g.date = m.date;
    } else {
      items.push({ kind: 'msg', m: m, sender: m.sender, out: m.out, date: m.date });
    }
  });
  var html = '<div class="msgs">' + moreHtml(true);
  var lastDay = '';
  var prev = null;
  items.forEach(function (it) {
    var first = it.kind === 'album' ? it.media[0] : it.m;
    var d = toDate(first.date);
    var day = d ? (d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日') : '';
    if (day && day !== lastDay) {
      html += '<div class="daysep"><span>' + day + '</span></div>';
      lastDay = day;
      prev = null;                 // 跨天不合并成一组
    }
    var grouped = sameAuthor(prev, it);
    html += it.kind === 'album' ? albumBubble(it, grouped) : msgBubble(it.m, grouped);
    prev = it;
  });
  html += '</div>';
  body.innerHTML = html;
}

// 上一条和这条是不是「同一个人连着发的」——决定是否贴紧、隐藏重复的头像
function sameAuthor(a, b) {
  if (!a || !b) return false;
  if (!!a.out !== !!b.out) return false;
  if ((a.sender || '') !== (b.sender || '')) return false;
  var ta = toDate(a.date), tb = toDate(b.date);
  if (!ta || !tb) return false;
  return Math.abs(tb.getTime() - ta.getTime()) < 300 * 1000;
}

var AV_COLORS = ['#e17076', '#7bc862', '#e5ca77', '#65aadd', '#a695e7', '#ee7aae', '#6ec9cb', '#faa774'];
function avColor(name) {
  var h = 0, s = String(name || '?');
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return AV_COLORS[Math.abs(h) % AV_COLORS.length];
}
function firstChar(name) {
  var s = String(name || '?').trim();
  return s ? s.slice(0, 1).toUpperCase() : '?';
}

/* 对话头像：有头像就叠一张 <img>，取不到时自动摘掉、露出底下的首字母（或星标） */
function avHtml(kind, peer, title, hasPhoto, cls) {
  var initial = kind === 'saved' ? '★' : esc(firstChar(title));
  var img = hasPhoto
    ? '<img src="/api/avatar?peer=' + encodeURIComponent(peer) + '" loading="lazy" alt="" onerror="this.remove()">'
    : '';
  return '<span class="' + cls + ' ' + esc(kind) + '">' + img + initial + '</span>';
}

// 头像：群/频道在左侧显示（同一个人的连续消息只在第一条显示，后面用占位保持对齐）
function avatarBlock(sender, out, grouped) {
  if (out) return '';
  if (S.peerKind === 'user' || S.peerKind === 'saved' || !S.peerKind) return '';
  if (grouped) return '<div class="av hide"></div>';
  var name = sender || S.peerTitle || '?';
  return '<div class="av" style="background:' + avColor(name) + '">' + esc(firstChar(name)) + '</div>';
}

function whoBlock(sender, out, grouped) {
  // 官方只在群聊里显示发送者名字，而且同一个人连续发只标一次
  if (out || !sender || S.peerKind !== 'group' || grouped) return '';
  return '<div class="who" style="color:' + avColor(sender) + '">' + esc(sender) + '</div>';
}

function msgBubble(m, grouped) {
  var on = S.sel.indexOf(m.id) >= 0;
  var visual = isVisual(m.kind);
  var tm = '<span class="tm">' + timeStr(m.date) + '</span>';
  var hasCap = !!m.text;
  var body;
  if (m.has_media && m.kind && visual) {
    // 图片/视频：铺满气泡；有说明文字时文字在下方，时间戳跟在最后一行文字尾巴上
    body = visualFigure(m)
      + (hasCap ? '<div class="mbody"><div class="tx">' + esc(m.text) + tm + '</div></div>' : tm);
  } else if (m.has_media && m.kind) {
    // 文件/音频：图标 + 名称大小，时间戳放在大小那一行的右侧
    body = fileLine(m, tm) + (hasCap ? '<div class="tx">' + esc(m.text) + '</div>' : '');
  } else {
    body = '<div class="tx">' + esc(m.text || '') + tm + '</div>';
  }

  var saved = isSavedChat();
  var trInfo = saved ? getBubbleTransferState([m.id]) : null;
  var fwLabel = trInfo ? esc((trInfo.stage || '转存中…').slice(0, 14)) : '转发';
  var disAttr = trInfo ? ' disabled' : '';
  var trJobAttr = trInfo ? (' data-tr-job="' + esc(trInfo.job_id) + '"') : '';
  var acts = saved
    ? '<div class="msg-acts">'
      + '<button class="act-btn fw" data-saved-fw="1"' + disAttr + ' title="下载并重新上传到目标群（原样式），按方案 C 移动本地文件并从我的收藏删除">' + fwLabel + '</button>'
      + '<button class="act-btn del" data-saved-del="1"' + disAttr + ' title="从我的收藏（云端+本地）直接丢弃删除">丢弃</button>'
      + '</div>'
    : '';
  var cls = 'mb' + (visual ? ' has-media' : '') + (visual && !hasCap ? ' no-cap' : '');
  return '<div class="msg' + (m.out ? ' out' : '') + (saved ? ' saved-msg' : '') + (on ? ' on' : '') + (grouped ? ' g' : '') + '" data-ids="' + m.id + '"' + trJobAttr + '>'
    + '<div class="mk" data-cb="1">' + I.check + '</div>'
    + avatarBlock(m.sender, m.out, grouped)
    + '<div class="' + cls + '">'
    + whoBlock(m.sender, m.out, grouped)
    + body
    + '</div>' + acts + '</div>';
}

/* ==========================================================================
   相册排布：Telegram Desktop 的 Ui::LayoutMediaGroup 移植
   （tdesktop/Telegram/SourceFiles/ui/grouped_layout.cpp）
   把每张图的宽高比折成 'w'（>1.2 横）/ 'q'（方）/ 'n'（<0.8 竖）字符串当模板键：
     2 张 → 上下叠(两张超宽且接近) / 左右等分(ww,qq) / 左右不等
     3 张 → 首张是竖图走「左大右两小」，否则「上大下两小」
     4 张 → 首张是横图走「上大下三小」，否则「左大右三小」
     ≥5 张或存在宽高比 >2 的图 → ComplexLayouter 枚举切行方案，选总高最接近 maxHeight 的
   输出是每个格子的像素矩形 + 它在组里贴哪几条边（sides）。
   ========================================================================== */
var GA = { max: 340, min: 68, gap: 2, outer: 12, inner: 3 };

// 气泡可用宽度：桌面留出左侧对话列表，手机只留两侧留白
function gaMaxWidth() {
  var w = (typeof window !== 'undefined' && window.innerWidth) || 1024;
  var pad = w <= 820 ? 104 : 560;
  return Math.max(180, Math.min(GA.max, w - pad));
}

function mediaSize(m) {
  var w = Number(m.width) || 0, h = Number(m.height) || 0;
  if (w > 0 && h > 0) return { w: w, h: h };
  return { w: 1, h: 1 };            // 拿不到原始尺寸时当正方形，和官方一致
}

function gaRound(v) { return Math.round(v); }
function gaPart(x, y, w, h, t, r, b, l) {
  return { x: x, y: y, w: w, h: h, sides: { t: !!t, r: !!r, b: !!b, l: !!l } };
}

function gaLayout(sizes, maxW, minW, gap) {
  var ratios = sizes.map(function (s) { return s.w / s.h; });
  var n = ratios.length;
  if (!n) return { w: maxW, h: maxW, parts: [] };
  var maxH = maxW;                 // 官方：先按正方形算，复杂排布才放宽到 4/3
  var sum = 0;
  for (var i = 0; i < n; i++) sum += ratios[i];
  var avg = (1 + sum) / n;         // 官方 accumulate 的种子是 1.0，这里照抄
  var props = ratios.map(function (r) { return r > 1.2 ? 'w' : (r < 0.8 ? 'n' : 'q'); }).join('');
  var ultra = false;
  for (var j = 0; j < n; j++) if (ratios[j] > 2) ultra = true;

  var parts;
  if (n === 1) parts = gaOne(ratios, maxW);
  else if (n >= 5 || ultra) parts = gaComplex(ratios, avg, maxW, minW, gap);
  else if (n === 2) parts = gaTwo(ratios, props, avg, maxW, maxH, minW, gap);
  else if (n === 3) parts = gaThree(ratios, props, maxW, maxH, minW, gap);
  else parts = gaFour(ratios, props, maxW, maxH, minW, gap);

  var h = 0;
  for (var k = 0; k < parts.length; k++) h = Math.max(h, parts[k].y + parts[k].h);
  return { w: maxW, h: Math.max(1, h), parts: parts };
}

function gaOne(ratios, maxW) {
  var h = gaRound(maxW / ratios[0]);
  h = Math.min(Math.max(h, gaRound(maxW * 0.4)), gaRound(maxW * 1.33));
  return [gaPart(0, 0, maxW, h, 1, 1, 1, 1)];
}

function gaTwo(ratios, props, avg, maxW, maxH, minW, gap) {
  var maxSizeRatio = maxW / maxH;
  if (props === 'ww' && avg > 1.4 * maxSizeRatio && (ratios[1] - ratios[0]) < 0.2) {
    // 上下叠（两张都很宽、比例接近）
    var w = maxW;
    var h = gaRound(Math.min(w / ratios[0], Math.min(w / ratios[1], (maxH - gap) / 2)));
    return [gaPart(0, 0, w, h, 1, 1, 0, 1), gaPart(0, h + gap, w, h, 0, 1, 1, 1)];
  }
  if (props === 'ww' || props === 'qq') {
    // 左右等分
    var bw = gaRound((maxW - gap) / 2);
    var bh = gaRound(Math.min(bw / ratios[0], Math.min(bw / ratios[1], maxH)));
    return [gaPart(0, 0, bw, bh, 1, 0, 1, 1), gaPart(bw + gap, 0, bw, bh, 1, 1, 1, 0)];
  }
  // 左右不等：右边那条按比例拿宽度，但不小于 0.4 份、左边不会被压到 1.5*minWidth 以下
  var minimal = gaRound(minW * 1.5);
  var second = Math.min(
    gaRound(Math.max(0.4 * (maxW - gap), (maxW - gap) / ratios[0] / (1 / ratios[0] + 1 / ratios[1]))),
    maxW - gap - minimal
  );
  var first = maxW - second - gap;
  var hh = Math.min(maxH, gaRound(Math.min(first / ratios[0], second / ratios[1])));
  return [gaPart(0, 0, first, hh, 1, 0, 1, 1), gaPart(first + gap, 0, second, hh, 1, 1, 1, 0)];
}

function gaThree(ratios, props, maxW, maxH, minW, gap) {
  if (props[0] === 'n') {
    // 左大右两小
    var firstH = maxH;
    var thirdH = gaRound(Math.min((maxH - gap) / 2, ratios[1] * (maxW - gap) / (ratios[2] + ratios[1])));
    var secondH = firstH - thirdH - gap;
    var rightW = Math.max(minW, gaRound(Math.min((maxW - gap) / 2,
      Math.min(thirdH * ratios[2], secondH * ratios[1]))));
    var leftW = Math.min(gaRound(firstH * ratios[0]), maxW - gap - rightW);
    return [
      gaPart(0, 0, leftW, firstH, 1, 0, 1, 1),
      gaPart(leftW + gap, 0, rightW, secondH, 1, 1, 0, 0),
      gaPart(leftW + gap, secondH + gap, rightW, thirdH, 0, 1, 1, 0)
    ];
  }
  // 上大下两小
  var firstW = maxW;
  var fh = gaRound(Math.min(firstW / ratios[0], (maxH - gap) * 0.66));
  var secondW = gaRound((maxW - gap) / 2);
  var sh = Math.min(maxH - fh - gap, gaRound(Math.min(secondW / ratios[1], secondW / ratios[2])));
  var thirdW = firstW - secondW - gap;
  return [
    gaPart(0, 0, firstW, fh, 1, 1, 0, 1),
    gaPart(0, fh + gap, secondW, sh, 0, 0, 1, 1),
    gaPart(secondW + gap, fh + gap, thirdW, sh, 0, 1, 1, 0)
  ];
}

function gaFour(ratios, props, maxW, maxH, minW, gap) {
  if (props[0] === 'w') {
    // 上大下三小
    var w = maxW;
    var h0 = gaRound(Math.min(w / ratios[0], (maxH - gap) * 0.66));
    var h = gaRound((maxW - 2 * gap) / (ratios[1] + ratios[2] + ratios[3]));
    var w0 = Math.max(minW, gaRound(Math.min((maxW - 2 * gap) * 0.4, h * ratios[1])));
    var w2 = gaRound(Math.max(Math.max(minW, (maxW - 2 * gap) * 0.33), h * ratios[3]));
    var w1 = w - w0 - w2 - 2 * gap;
    var h1 = Math.min(maxH - h0 - gap, h);
    return [
      gaPart(0, 0, w, h0, 1, 1, 0, 1),
      gaPart(0, h0 + gap, w0, h1, 0, 0, 1, 1),
      gaPart(w0 + gap, h0 + gap, w1, h1, 0, 0, 1, 0),
      gaPart(w0 + gap + w1 + gap, h0 + gap, w2, h1, 0, 1, 1, 0)
    ];
  }
  // 左大右三小
  var hh = maxH;
  var lw = gaRound(Math.min(hh * ratios[0], (maxW - gap) * 0.6));
  var rw = gaRound((maxH - 2 * gap) / (1 / ratios[1] + 1 / ratios[2] + 1 / ratios[3]));
  var rh0 = gaRound(rw / ratios[1]);
  var rh1 = gaRound(rw / ratios[2]);
  var rh2 = hh - rh0 - rh1 - 2 * gap;
  var rw1 = Math.max(minW, Math.min(maxW - lw - gap, rw));
  return [
    gaPart(0, 0, lw, hh, 1, 0, 1, 1),
    gaPart(lw + gap, 0, rw1, rh0, 1, 1, 0, 0),
    gaPart(lw + gap, rh0 + gap, rw1, rh1, 0, 1, 0, 0),
    gaPart(lw + gap, rh0 + rh1 + 2 * gap, rw1, rh2, 0, 1, 1, 0)
  ];
}

// ≥5 张 / 有超宽图：枚举 1~4 行、每行 ≤3 张的切法，挑总高最接近 maxHeight 的一种
function gaComplex(ratios, avg, maxW, minW, gap) {
  var n = ratios.length, maxH = maxW * 4 / 3;
  var c = ratios.map(function (r) {
    return avg > 1.1 ? Math.min(Math.max(r, 1), 2.75) : Math.min(Math.max(r, 0.6667), 1);
  });
  var attempts = [];
  function lineH(off, cnt) {
    var s = 0;
    for (var i = 0; i < cnt; i++) s += c[off + i];
    return (maxW - (cnt - 1) * gap) / s;
  }
  function push(counts) {
    var heights = [], off = 0;
    for (var i = 0; i < counts.length; i++) { heights.push(lineH(off, counts[i])); off += counts[i]; }
    attempts.push({ counts: counts.slice(), heights: heights });
  }
  var a, b, d, e;
  for (a = 1; a < n; a++) {
    b = n - a;
    if (a > 3 || b > 3) continue;
    push([a, b]);
  }
  for (a = 1; a < n - 1; a++) {
    for (b = 1; b < n - a; b++) {
      d = n - a - b;
      if (a > 3 || b > (avg < 0.85 ? 4 : 3) || d > 3) continue;
      push([a, b, d]);
    }
  }
  for (a = 1; a < n - 1; a++) {
    for (b = 1; b < n - a; b++) {
      for (d = 1; d < n - a - b; d++) {
        e = n - a - b - d;
        if (a > 3 || b > 3 || d > 3 || e > 3) continue;
        push([a, b, d, e]);
      }
    }
  }
  var best = null, bestDiff = 0;
  for (var i = 0; i < attempts.length; i++) {
    var at = attempts[i], lc = at.counts.length, total = gap * (lc - 1);
    var minLine = Infinity;
    for (var q = 0; q < at.heights.length; q++) {
      total += at.heights[q];
      if (at.heights[q] < minLine) minLine = at.heights[q];
    }
    var bad1 = minLine < minW ? 1.5 : 1;
    var bad2 = 1;
    for (var q2 = 1; q2 < lc; q2++) {
      if (at.counts[q2 - 1] > at.counts[q2]) { bad2 = 1.5; break; }
    }
    var diff = Math.abs(total - maxH) * bad1 * bad2;
    if (!best || diff < bestDiff) { best = at; bestDiff = diff; }
  }
  var parts = [], idx = 0, y = 0, rows = best.counts.length;
  for (var row = 0; row < rows; row++) {
    var cols = best.counts[row], lh = best.heights[row], h = gaRound(lh), x = 0;
    for (var col = 0; col < cols; col++) {
      var w = (col === cols - 1) ? (maxW - x) : gaRound(c[idx] * lh);
      parts.push(gaPart(x, y, w, h, row === 0, col === cols - 1, row === rows - 1, col === 0));
      x += w + gap;
      idx++;
    }
    y += h + gap;
  }
  return parts;
}

// 圆角：两侧都贴到组的外沿才是气泡圆角，内部接缝是方的（官方 GetCornersFromSides）
function gaRadius(sides, hasCap) {
  var R = GA.outer, botR = hasCap ? GA.inner : GA.outer;
  var tl = (sides.t && sides.l) ? R : 0;
  var tr = (sides.t && sides.r) ? R : 0;
  var br = (sides.b && sides.r) ? botR : 0;
  var bl = (sides.b && sides.l) ? botR : 0;
  return tl + 'px ' + tr + 'px ' + br + 'px ' + bl + 'px';
}

function albumFigure(g) {
  var allVisual = true;
  for (var i = 0; i < g.media.length; i++) if (!isVisual(g.media[i].kind)) allVisual = false;
  // 官方：播放列表 / 文件组走 Mode::Column 纵向堆叠，不进网格
  if (!allVisual) {
    return '<div class="gcol">' + g.media.map(function (m) {
      return isVisual(m.kind) ? visualFigure(m) : fileLine(m);
    }).join('') + '</div>';
  }
  var geo = gaLayout(g.media.map(mediaSize), gaMaxWidth(), GA.min, GA.gap);
  var hasCap = !!g.text;
  var html = '<div class="galbum" style="width:' + geo.w + 'px;height:' + geo.h + 'px">';
  g.media.forEach(function (m, k) {
    var p = geo.parts[k];
    if (!p) return;
    html += '<div class="gp" data-play="1" data-id="' + m.id + '" style="left:' + p.x + 'px;top:' + p.y
      + 'px;width:' + p.w + 'px;height:' + p.h + 'px;border-radius:' + gaRadius(p.sides, hasCap) + '">'
      + (hasThumb(m.kind) ? '<img loading="lazy" alt="" src="' + thumbUrl(S.peer, m.id) + '" onerror="this.remove()">' : '')
      + iconFor(m.kind)
      + (overlayKind(m.kind) ? '<span class="pl">' + I.play + '</span>' : '')
      + (m.duration ? '<span class="dur">' + durStr(m.duration) + '</span>' : '')
      + (m.local ? '<span class="locdot" title="已下载到本地"></span>' : '')
      + '</div>';
  });
  return html + '</div>';
}

function albumBubble(g, grouped) {
  var allOn = g.ids.length > 0 && g.ids.every(function (id) { return S.sel.indexOf(id) >= 0; });
  var meta = ' · ' + g.media.length + ' 张';
  var cap = g.text
    ? '<div class="mbody"><div class="tx">' + esc(g.text) + '<span class="tm">' + timeStr(g.date) + meta + '</span></div></div>'
    : '<span class="tm">' + timeStr(g.date) + meta + '</span>';
  var saved = isSavedChat();
  var trInfo = saved ? getBubbleTransferState(g.ids) : null;
  var fwLabel = trInfo ? esc((trInfo.stage || '转存中…').slice(0, 14)) : '转发';
  var disAttr = trInfo ? ' disabled' : '';
  var trJobAttr = trInfo ? (' data-tr-job="' + esc(trInfo.job_id) + '"') : '';
  var acts = saved
    ? '<div class="msg-acts">'
      + '<button class="act-btn fw" data-saved-fw="1"' + disAttr + ' title="整组下载并重新上传到目标群（原样式），按方案 C 移动本地文件并从我的收藏删除">' + fwLabel + '</button>'
      + '<button class="act-btn del" data-saved-del="1"' + disAttr + ' title="整组从我的收藏（云端+本地）直接丢弃删除">丢弃</button>'
      + '</div>'
    : '';
  return '<div class="msg' + (g.out ? ' out' : '') + (saved ? ' saved-msg' : '') + (allOn ? ' on' : '') + (grouped ? ' g' : '') + '" data-ids="' + g.ids.join(',') + '"' + trJobAttr + '>'
    + '<div class="mk" data-cb="1">' + I.check + '</div>'
    + avatarBlock(g.sender, g.out, grouped)
    + '<div class="mb has-media' + (g.text ? '' : ' no-cap') + '">'
    + whoBlock(g.sender, g.out, grouped)
    + albumFigure(g)
    + cap
    + '</div>' + acts + '</div>';
}

// 图片 / 视频：铺满气泡宽度的媒体块
function visualFigure(m) {
  var play = overlayKind(m.kind);
  return '<div class="mfig" data-play="1" data-id="' + m.id + '">'
    + (hasThumb(m.kind) ? '<img loading="lazy" alt="" src="' + thumbUrl(S.peer, m.id) + '" onerror="this.remove()">' : '')
    + iconFor(m.kind)
    + (play ? '<span class="pl"><span>' + I.play + '</span></span>' : '')
    + (m.duration ? '<span class="dur">' + durStr(m.duration) + '</span>' : '')
    + (m.local ? '<span class="locdot" title="已下载到本地，播放走磁盘"></span>' : '')
    + '</div>';
}

// 文件 / 音频：圆形图标 + 名称与大小（时间戳挤在大小那一行的右边）
function fileLine(m, tm) {
  var k = kindOf(m.kind);
  return '<div class="mfile" data-play="1" data-id="' + m.id + '">'
    + '<span class="ic" style="background:' + k.c + '">' + iconFor(m.kind) + '</span>'
    + '<span class="mm"><span class="nm">' + esc(m.filename || k.t) + '</span>'
    + '<span class="sv"><span>' + bytes(m.size) + (m.duration ? ' · ' + durStr(m.duration) : '')
    + (m.local ? ' · <b style="color:var(--ok)">已存本地</b>' : '') + '</span>'
    + (tm || '') + '</span></span></div>';
}

function moreHtml(atTop) {
  if (S.loadingMore) return '<div class="loadmore"><span class="spin"></span>正在加载更多…</div>';
  if (S.hasMore) return '<div class="loadmore" data-more="1">继续滑动加载更多</div>';
  return atTop ? '' : '<div class="loadmore">— 已经到头了 —</div>';
}

function paintMoreHint() {
  var body = $('#chatBody');
  if (!body) return;
  var old = $('.loadmore', body);
  var html = moreHtml(S.viewMode === 'text');
  if (old) old.outerHTML = html;
  else if (html) {
    var host = $('.msgs', body) || $('.grid', body);
    if (host) host.insertAdjacentHTML(S.viewMode === 'text' ? 'afterbegin' : 'beforeend', html);
  }
}

function iconFor(kind) {
  return kind === 'photo' || kind === 'image' ? I.image
    : kind === 'video' ? I.video
      : (kind === 'audio' || kind === 'voice') ? I.audio : I.file;
}

function isPlayable(kind) {
  return kind === 'photo' || kind === 'image' || kind === 'video' || kind === 'audio' || kind === 'voice';
}

// 会在气泡里铺满一块画面的类型（其余走「图标 + 文件名」的文件行）
function isVisual(kind) {
  return kind === 'photo' || kind === 'image' || kind === 'video' || kind === 'sticker';
}

function overlayKind(kind) {
  return kind === 'video' || kind === 'audio' || kind === 'voice';
}

function durStr(s) {
  s = Math.max(0, Number(s) || 0);
  var m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + pad(sec);
}

/* ---------------- 在线播放 ---------------- */
function streamUrl(peer, id, dl) {
  return '/api/media/stream?peer=' + encodeURIComponent(peer) + '&id=' + encodeURIComponent(id) + (dl ? '&dl=1' : '');
}

var VW = { scale: 1, rot: 0, tx: 0, ty: 0, dragging: false, sx: 0, sy: 0, rate: 1 };

function playableIds() {
  return S.msgs.filter(function (m) {
    return m && (m.has_media || (m.kind && m.kind !== 'text'));
  }).map(function (m) { return Number(m.id); });
}

function stepViewer(dir) {
  var v = $('#viewer');
  if (!v || !v.classList.contains('show') || !S.viewingId) return;
  var list = playableIds();
  var idx = list.indexOf(Number(S.viewingId));
  if (idx < 0) return;
  var next = idx + dir;
  if (next < 0 || next >= list.length) {
    toast(dir < 0 ? '已经是第一个媒体' : '已经是最后一个媒体');
    return;
  }
  openViewer(list[next]);
}

function applyImgTransform() {
  var w = $('#vwImgWrap');
  if (!w) return;
  w.style.transform = 'translate(' + VW.tx + 'px,' + VW.ty + 'px) scale(' + VW.scale + ') rotate(' + VW.rot + 'deg)';
  var zv = $('#vwZoomReset');
  if (zv) zv.textContent = Math.round(VW.scale * 100) + '%';
}

function zoomViewerImg(delta, reset) {
  if (reset) {
    VW.scale = 1; VW.rot = 0; VW.tx = 0; VW.ty = 0;
  } else {
    VW.scale = Math.min(5, Math.max(0.4, Math.round((VW.scale + delta) * 100) / 100));
    if (VW.scale <= 1) { VW.tx = 0; VW.ty = 0; }
  }
  applyImgTransform();
}

function rotateViewerImg() {
  VW.rot = (VW.rot + 90) % 360;
  applyImgTransform();
}

function preloadNeighborImages(list, idx) {
  [idx + 1, idx - 1].forEach(function (i) {
    if (i < 0 || i >= list.length) return;
    var nm = msgById(list[i]);
    if (nm && (nm.kind === 'photo' || nm.kind === 'image' || nm.kind === 'sticker')) {
      var img = new Image();
      img.src = streamUrl(S.peer, nm.id);
    }
  });
}

function openViewer(id) {

      + '<button class="btn sm" id="vwZoomIn" title="放大 (+)">＋</button>'
      + '<button class="btn sm" id="vwRotate" title="旋转 90° (R)">↻</button>'
      + '</div>'
      + '<div class="vw-tools" id="vwVidTools" style="display:none">'

      + '<option value="0.75">0.75x</option><option value="1" selected>1.0x</option>'
      + '<option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option></select>'
      + '<button class="btn sm" id="vwPip" title="画中画悬浮播放">画中画</button>'
      + '</div>'
      + '<button class="btn sm" id="vwJump" title="在聊天消息气泡中定位这条内容">定位消息</button>'
      + '<button class="btn sm" id="vwPrev" title="上一个">‹</button>'
      + '<button class="btn sm" id="vwNext" title="下一个">›</button>'

      + '<button class="iconbtn" id="vwClose" title="关闭 (Esc)">'

    $('#vwZoomIn', v).addEventListener('click', function () { zoomViewerImg(0.35, false); });

    $('#vwZoomReset', v).addEventListener('click', function () { zoomViewerImg(0, true); });
    $('#vwRotate', v).addEventListener('click', rotateViewerImg);
    $('#vwJump', v).addEventListener('click', function () {

    $('#vwSpeed', v).addEventListener('change', function (e) {

    $('#vwPip', v).addEventListener('click', function () {

      if (vid && vid.requestPictureInPicture) {

        else vid.requestPictureInPicture().catch(function (e) { toast('画中画不可用：' + e.message); });
      } else {

  var list = playableIds();

  $('#vwBadge').innerHTML = m.local
    ? '<span class="tag green">本地磁盘秒开</span>'
    : '<span class="tag teal">在线流播</span>';

  var url = streamUrl(S.peer, m.id);
  var tUrl = thumbUrl(S.peer, m.id);
  var kind = m.kind || 'file';

  var isVidOrAud = (kind === 'video' || kind === 'audio' || kind === 'voice');
  $('#vwImgTools').style.display = isImg ? 'inline-flex' : 'none';

  $('#vwZoomReset').textContent = '100%';

  var navBtns = (list.length > 1)
    ? '<button class="vw-nav prev" data-nav="-1" title="上一个">‹</button><button class="vw-nav next" data-nav="1" title="下一个">›</button>'
    : '';
  var inner;
  if (kind === 'video') {
    inner = '<div class="vw-stage">' + navBtns
      + (!m.local ? '<div class="vw-loading" id="vwVidSpin" style="pointer-events:none"><span class="spin"></span><span>正在从 Telegram 缓冲视频流…</span></div>' : '')
      + '<video id="vwVideo" src="' + url + '" poster="' + tUrl + '" controls autoplay playsinline webkit-playsinline preload="auto"></video></div>';
  } else if (isImg) {
    // 先展示已缓存的缩略图作模糊打底，原图加载完成后平滑切入并移除加载指示
    inner = '<div class="vw-stage" id="vwStage">' + navBtns
      + '<div class="vw-loading" id="vwSpin"><span class="spin"></span><span>正在加载高清原图…</span></div>'
      + '<div class="vw-imgwrap" id="vwImgWrap">'
      + '<img class="vw-thumb-bg" src="' + tUrl + '" alt="" onerror="this.remove()">'
      + '<img class="vw-full" id="vwFullImg" src="' + url + '" alt="">'
      + '</div></div>';
  } else if (kind === 'audio' || kind === 'voice') {
    inner = '<div class="vw-stage">' + navBtns
      + '<audio id="vwAudio" src="' + url + '" controls autoplay preload="auto"></audio></div>';
  } else {
    inner = '<div class="vw-stage">' + navBtns
      + '<div class="noplay">' + kindOf(kind).t + ' 不支持在线预览<br>'
      + esc(m.filename || '') + '<br>' + bytes(m.size) + '</div></div>';
  }
  $('#vwTitle').textContent = m.filename || kindOf(kind).t;
  $('#vwSub').textContent = (m.size ? bytes(m.size) + ' · ' : '') + fullTime(m.date);
  var body = $('#vwBody');
  body.innerHTML = inner;

  $$('[data-nav]', body).forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); stepViewer(Number(b.dataset.nav)); });
  });
  var stage = $('.vw-stage', body);
  if (stage) {
    stage.addEventListener('click', function (e) { if (e.target === stage) closeViewer(); });
  }

  if (isVidOrAud) {
    var mediaEl = $('#vwVideo, #vwAudio', body);
    if (mediaEl && VW.rate && VW.rate !== 1) mediaEl.playbackRate = VW.rate;
    var vSpin = $('#vwVidSpin', body);
    if (mediaEl && vSpin) {
      var hideVSpin = function () { vSpin.style.display = 'none'; };
      var showVSpin = function () { vSpin.style.display = 'inline-flex'; };
      mediaEl.addEventListener('canplay', hideVSpin);
      mediaEl.addEventListener('playing', hideVSpin);
      mediaEl.addEventListener('timeupdate', hideVSpin);
      mediaEl.addEventListener('waiting', showVSpin);
      mediaEl.addEventListener('error', function () {
        vSpin.style.display = 'inline-flex';
        vSpin.innerHTML = '<span>在线流加载失败，建议点击右上角「下载」保存到本地后秒开播放</span>';
      });
    }
  }

  if (isImg) {
    var fullImg = $('#vwFullImg', body);
    var wrap = $('#vwImgWrap', body);
    var spin = $('#vwSpin', body);
    if (fullImg) {
      var onDone = function () {
        if (wrap) wrap.classList.add('loaded');
        if (spin) spin.style.display = 'none';
      };
      if (fullImg.complete && fullImg.naturalWidth > 0) onDone();
      else {
        fullImg.addEventListener('load', onDone);
        fullImg.addEventListener('error', function () {
          if (spin) spin.innerHTML = '原图加载失败，显示缩略图';
        });
      }
    }
    bindImageInteractions(stage, wrap);
    if (idx >= 0) preloadNeighborImages(list, idx);
  }

  paintViewerStrip(list, Number(m.id));

  var shortcutHint = isImg
    ? '滚轮缩放 · 双击放大/还原 · 拖拽平移 · ←/→ 切换上下张'
    : (isVidOrAud ? '←/→ 快退/快进 5 秒 · Shift+←/→ 切换上下个媒体 · Space 暂停/播放' : '');
  $('#vwFoot').innerHTML = '<span>' + (m.local
    ? '已下载到本机，直接从磁盘高速读取（不占网络带宽）。'

      ? '在线流式加载：支持进度条任意拖动与原图自动缓存。'
      : '这个类型只能下载，不能直接在线预览。')) + '</span>'

  dl.onclick = function () {

      toast((forceDl ? '已创建重新下载任务 #' : '已加入下载任务 #') + d.job_id);
      refreshJobs();
    }).catch(function (e) { toast(e.message); });
  };
  v.classList.add('show');
}

function bindImageInteractions(stage, wrap) {
  if (!stage || !wrap) return;
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomViewerImg(e.deltaY < 0 ? 0.25 : -0.25, false);
  }, { passive: false });
  wrap.addEventListener('dblclick', function (e) {
    e.stopPropagation();
    if (VW.scale > 1.05) zoomViewerImg(0, true);
    else { VW.scale = 2.2; applyImgTransform(); }
  });
  wrap.addEventListener('pointerdown', function (e) {
    if (VW.scale <= 1) return;
    VW.dragging = true;
    VW.sx = e.clientX - VW.tx;
    VW.sy = e.clientY - VW.ty;
    wrap.classList.add('dragging');
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!VW.dragging) return;
    VW.tx = e.clientX - VW.sx;
    VW.ty = e.clientY - VW.sy;
    applyImgTransform();
  });
  var endDrag = function () { VW.dragging = false; wrap.classList.remove('dragging'); };
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);

  // 手机左右滑动切换图片（未放大时）
  var touchX = 0, touchY = 0;
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1 && VW.scale <= 1) {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    } else { touchX = 0; }
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (!touchX || VW.scale > 1 || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      stepViewer(dx < 0 ? 1 : -1);
    }
    touchX = 0;
  }, { passive: true });
}

function paintViewerStrip(list, activeId) {
  var strip = $('#vwStrip');
  if (!strip) return;
  if (list.length <= 1) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';
  var idx = list.indexOf(activeId);
  var start = Math.max(0, idx - 15), end = Math.min(list.length, idx + 16);
  var slice = list.slice(start, end);
  strip.innerHTML = slice.map(function (mid) {
    var item = msgById(mid);
    if (!item) return '';
    var on = Number(mid) === Number(activeId);
    return '<div class="st-it' + (on ? ' on' : '') + '" data-stid="' + mid + '" title="' + esc(item.filename || ('#' + mid)) + '">'
      + iconFor(item.kind)
      + (hasThumb(item.kind) ? '<img loading="lazy" alt="" src="' + thumbUrl(S.peer, mid) + '" onerror="this.remove()">' : '')
      + '</div>';
  }).join('');
  $$('[data-stid]', strip).forEach(function (el) {
    el.addEventListener('click', function () { openViewer(Number(el.dataset.stid)); });
  });
  var curEl = $('.st-it.on', strip);
  if (curEl && curEl.scrollIntoView) {
    try { curEl.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {}
  }
}

function closeViewer() {
  var v = $('#viewer');
  if (!v) return;
  if (document.pictureInPictureElement) {
    try { document.exitPictureInPicture(); } catch (e) {}
  }
  S.viewingId = null;
  v.classList.remove('show');
  $('#vwBody').innerHTML = '';   // 清掉 video 元素，停止后台取流
}

// 只有图片/视频/贴纸在 Telegram 里带缩略图，音频和普通文件没有，别去请求
function hasThumb(kind) {
  return kind === 'photo' || kind === 'image' || kind === 'video' || kind === 'sticker';
}

function thumbUrl(peer, id) {
  return '/api/media/thumb?peer=' + encodeURIComponent(peer) + '&id=' + encodeURIComponent(id);
}

/* ---------------- 我的收藏：一键转存归档（下载上传+移动文件+删云端）与一键丢弃 ---------------- */
function openArchiveTargetDialog(afterSave) {
  var targets = S.dialogs.filter(function (d) { return d.kind !== 'saved' && String(d.peer) !== String(S.peer); });

    + '<input class="inp" id="arManualId" value="' + esc(cur.peer) + '" placeholder="-100xxxxxxxxxx">'
    + '<div class="tip">选中上方列表会自动填入群组数字 ID。绑定数字 ID 后，即使以后修改群名称也无需重新配置。</div></div>',
    '<button class="btn" onclick="closeDlg()">取消</button><button class="btn primary" id="arSave">保存目标群</button>', true);
  bindPeerPicker('ar', targets);
  var pkInp = $('#arPeer'), manInp = $('#arManualId');

    });

    var title = (pkInp && String(pkInp.value) === peer && pkInp.dataset.t) || '';
    for (var i = 0; i < S.dialogs.length; i++) {

function handleSavedTransfer(msgNode, btn) {
  if (btn.disabled) return;
  var ids = String(msgNode.dataset.ids || '').split(',').map(Number).filter(Boolean);
  if (!ids.length) return;
  var tgt = resolveArchiveTarget();
  if (!tgt.peer) {
    openArchiveTargetDialog(function (newPeer) {
      if (newPeer) execSavedTransfer(msgNode, btn, ids, newPeer);
    });
    return;
  }
  execSavedTransfer(msgNode, btn, ids, tgt.peer);
}

function getBubbleTransferState(ids) {
  if (!S.transfers) S.transfers = {};
  for (var jid in S.transfers) {
    var tr = S.transfers[jid];
    if (!tr || tr.state !== 'running') continue;
    for (var i = 0; i < ids.length; i++) {
      if ((tr.ids || []).indexOf(Number(ids[i])) >= 0) return tr;
    }
  }
  return null;
}

function execSavedTransfer(msgNode, btn, ids, targetPeer) {
  btn.disabled = true;
  btn.textContent = '排队转存…';
  var delBtn = $('[data-saved-del]', msgNode);
  if (delBtn) delBtn.disabled = true;
  if (!S.transfers) S.transfers = {};

  api('transfer.saved', { peer: S.peer, ids: ids, target: targetPeer, async_job: true }).then(function (d) {
    var jid = d.job_id || '';
    S.transfers[jid] = { job_id: jid, ids: ids.slice(), stage: '校验源消息…', state: 'running', peer: S.peer };
    msgNode.dataset.trJob = jid;
    btn.textContent = '校验源消息…';
    toast('已加入转存任务 #' + jid + '（可在「任务台」或「日志」查看实时步骤）', 2800);
    refreshJobs();
  }).catch(function (e) {
    btn.disabled = false;
    btn.textContent = '转发';
    if (delBtn) delBtn.disabled = false;
    toast('创建转存任务失败：' + e.message, 3500);
  });
}

function handleSavedDiscard(msgNode, btn) {
  if (btn.disabled) return;
  var ids = String(msgNode.dataset.ids || '').split(',').map(Number).filter(Boolean);
  if (!ids.length) return;
  btn.disabled = true;
  btn.textContent = '丢弃中…';
  var fwBtn = $('[data-saved-fw]', msgNode);
  if (fwBtn) fwBtn.disabled = true;

  api('message.delete', { peer: S.peer, ids: ids, cloud: true }).then(function (d) {
    var gone = {};
    ids.forEach(function (id) { gone[id] = 1; });
    S.msgs = S.msgs.filter(function (m) { return !gone[m.id]; });
    S.sel = S.sel.filter(function (id) { return !gone[id]; });
    msgNode.remove();
    updateSelBar();
    var meta = $('#peerMeta');
    if (meta) meta.textContent = S.msgs.length ? (S.msgs.length + (S.hasMore ? '+' : '') + ' 条消息') : '';
    toast('已从我的收藏丢弃 ' + ids.length + ' 条消息' + (d.local_files ? '（含本地文件 ' + d.local_files + ' 个）' : ''));
  }).catch(function (e) {
    btn.disabled = false;
    btn.textContent = '丢弃';
    if (fwBtn) fwBtn.disabled = false;
    toast('丢弃失败：' + e.message);
  });
}

/* ---------------- 删除：本地文件 + Telegram 云端 ---------------- */
function openDeleteDialog() {
  if (!S.peer || !S.sel.length) return;
  confirmExpand(S.sel.slice(), '删除').then(function (ids) {
    if (!ids) return;

function doDeleteDialog(ids) {
  var picked = S.msgs.filter(function (m) { return ids.indexOf(m.id) >= 0; });
  var localN = picked.filter(function (m) { return m.local; }).length;
  var size = picked.reduce(function (a, m) { return a + Number(m.size || 0); }, 0);
  openDlg('删除消息',
    '<div class="hint">将删除 <b>' + ids.length + '</b> 条' + (size ? '（约 ' + bytes(size) + '）' : '') + '。<br>'
    + '勾选「同步云端」后，这些消息会从 Telegram 上一起删掉 —— '
    + '<b>你的手机、电脑等所有设备都会同步消失，且无法撤销</b>。'

function downloadSelected() {
  if (!S.peer || !S.sel.length) return;
  // 纯文本消息没法下载，先过滤掉，避免建一个空任务
  var ids = S.sel.filter(function (id) {
    var m = msgById(id);
    return m && m.has_media !== false && m.kind !== 'text';
  });
  if (!ids.length) { toast('选中的都是纯文本消息，没有可下载的媒体'); return; }
  // 已经下过的先提示一句：后端会直接跳过，不会真的再走流量
  var already = ids.filter(function (id) { var m = msgById(id); return m && m.local; }).length;
  confirmExpand(ids, '下载').then(function (finalIds) {
    if (!finalIds) return;
    api('download.start', { peer: S.peer, ids: finalIds }).then(function (d) {
      toast('已创建任务 ' + d.job_id + '，共 ' + finalIds.length + ' 个文件'
        + (already ? '（其中 ' + already + ' 个已下载，会跳过）' : ''));
      S.sel = []; updateSelBar(); refreshJobs();
    }).catch(function (e) { toast('创建任务失败：' + e.message); });
  });
}

function openForwardDialog() {
  if (!S.peer || !S.sel.length) return;
  confirmExpand(S.sel.slice(), '转发').then(function (ids) {
    if (!ids) return;
    doForward(ids);
  });
}

/* 带头像和实时搜索的对话选择器（供自动规则、批量下载、转发共用） */
function peerPickerHtml(prefix, dialogs, initPeer) {

function bindPeerPicker(prefix, dialogs) {

  if (sbox) sbox.addEventListener('input', renderRows);
  renderRows();
}

/* 相册/消息组扩选检查：选中项里如果有同组媒体没勾上，提示是否整组一起操作。 */
function albumExtras(ids) {
  var mine = {};
  ids.forEach(function (id) { mine[id] = 1; });
  var groups = {}, extra = [], groupCount = 0;
  S.msgs.forEach(function (m) {
    if (!m.grouped_id) return;
    (groups[m.grouped_id] = groups[m.grouped_id] || []).push(m);
  });
  Object.keys(groups).forEach(function (g) {
    var list = groups[g];
    var picked = list.filter(function (m) { return mine[m.id]; });
    if (!picked.length) return;
    var rest = list.filter(function (m) { return !mine[m.id]; });
    if (rest.length) {
      groupCount++;
      rest.forEach(function (m) { extra.push(m.id); });
    }
  });
  return { extra: extra, groups: groupCount };
}

function confirmExpand(ids, verb) {
  var r = albumExtras(ids);
  if (!r.extra.length) return Promise.resolve(ids);
  return new Promise(function (resolve) {
    openDlg('这些消息属于同一个相册',
      '<div class="hint">你选中的消息里有 <b>' + r.groups + '</b> 个相册（Telegram 的多图/多视频消息组），'
      + '同组还有 <b>' + r.extra.length + '</b> 条没被勾选。<br>'
      + '要按「整条消息」扩选，把同组的一起' + verb + '吗？</div>',
      '<button class="btn" id="exCancel">取消</button>'
      + '<button class="btn" id="exNo">只按已选 ' + ids.length + ' 条</button>'
      + '<button class="btn primary" id="exYes">扩选并继续（' + (ids.length + r.extra.length) + ' 条）</button>');
    $('#exCancel').addEventListener('click', function () { closeDlg(); resolve(null); });
    $('#exNo').addEventListener('click', function () { closeDlg(); resolve(ids); });
    $('#exYes').addEventListener('click', function () {
      closeDlg();
      var all = ids.concat(r.extra);
      S.sel = all; updateSelBar();
      resolve(all);
    });
  });
}

/* ================= 任务台 ================= */
var JOB_STATE = {
  queued: { t: '待执行', c: '#a1a1aa' }, running: { t: '进行中', c: '#0f766e' },
  cancelling: { t: '取消中', c: '#b45309' }, done: { t: '已完成', c: '#15803d' },
  partial: { t: '有失败', c: '#b45309' }, failed: { t: '失败', c: '#b91c1c' },
  cancelled: { t: '已取消', c: '#a1a1aa' },
  interrupted: { t: '已中断', c: '#b45309' }
};
/* 任务能不能重试：跑着的时候不行，其它（失败/有失败/已中断/已取消）都可以 */
function jobRetryable(j) {
  return j && ['queued', 'running', 'cancelling'].indexOf(j.state) < 0
    && (j.failed > 0 || j.state === 'interrupted' || j.state === 'cancelled'
        || (j.state === 'done' && (j.files || []).some(function (f) { return f.error; })));
}

function renderTasks() {
  var wrap = el('<div class="shell"></div>');
  var panel = el('<aside class="panel">'
    + '<div class="panel-hd"><span class="ttl">任务</span><span class="cnt" id="jobCnt">0</span>'
    + '<span style="flex:1"></span>'
    + '<button class="iconbtn" id="btnJobClear" title="清空已结束的任务（失败/取消的任务会连同已下载文件一起删除）">' + I.trash + '</button>'
    + '<button class="iconbtn" id="btnJobRefresh" title="刷新">' + I.refresh + '</button></div>'
    + '<div class="panel-search"><input class="inp" id="jobSearch" placeholder="搜索任务名称、对话"></div>'
    + '<div class="counter" id="jobCounter"></div>'
    + '<div class="panel-body" id="jobList"></div>'
    + '<div class="panel-ft"><button class="btn" id="btnNewTask">' + I.plus + '<span>新建任务</span></button></div></aside>');
  var content = el('<div class="content"><div class="tabs" id="taskTabs"></div><div class="body" id="taskBody"></div></div>');
  wrap.appendChild(panel); wrap.appendChild(content);

  $('#jobSearch', panel).value = S.jobQuery;
  $('#jobSearch', panel).addEventListener('input', function (e) { S.jobQuery = e.target.value; paintJobs(); });
  $('#btnJobRefresh', panel).addEventListener('click', function () { refreshJobs(true); });
  $('#btnJobClear', panel).addEventListener('click', function () {
    if (!confirm('清空已结束的任务记录？\n\n失败/取消的任务会连同已下载的文件一起删除；成功任务的文件会保留。')) return;
    api('task.clear').then(function (d) {
      S.jobs = (d && d.jobs) || [];
      if (S.jobSel && !findJob()) { S.jobSel = null; S.taskView = 'new'; }
      paintTaskTabs(); paintTaskBody(); paintJobs();
      toast('已清空 ' + ((d && d.removed) || 0) + ' 条记录');
    }).catch(function (e) { toast(e.message); });
  });
  $('#btnNewTask', panel).addEventListener('click', function () {
    S.taskView = 'new'; S.jobSel = null; paintTaskTabs(); paintTaskBody(); paintJobs();
  });
  $('#jobCounter', panel).addEventListener('click', function (e) {
    var s = e.target.closest('span[data-f]');
    if (!s) return;
    S.jobFilter = s.dataset.f; paintJobs();
  });
  setTimeout(function () { paintTaskTabs(); paintTaskBody(); paintJobs(); }, 0);
  refreshJobs();
  return wrap;
}

function paintTaskTabs() {
  var tabs = $('#taskTabs');
  if (!tabs) return;
  var job = null;
  for (var i = 0; i < S.jobs.length; i++) if (S.jobs[i].job_id === S.jobSel) job = S.jobs[i];
  tabs.innerHTML = '<button class="tab' + (S.taskView === 'new' ? ' on' : '') + '" data-t="new">' + I.plus + '<span>新建任务</span></button>'
    + (job ? '<button class="tab on" data-t="job">' + I.dl + '<span>' + esc((job.title || job.peer).slice(0, 16)) + '</span><span class="x" data-close="1">✕</span></button>' : '');
  $$('.tab', tabs).forEach(function (t) {
    t.addEventListener('click', function (e) {
      if (e.target.dataset.close) { S.jobSel = null; S.taskView = 'new'; paintTaskTabs(); paintTaskBody(); paintJobs(); return; }
      S.taskView = t.dataset.t; paintTaskTabs(); paintTaskBody();
    });
  });
}

function paintJobs() {
  var box = $('#jobList');
  if (!box) return;
  var cnt = $('#jobCnt'); if (cnt) cnt.textContent = S.jobs.length;
  var counts = { all: S.jobs.length, queued: 0, running: 0, done: 0, partial: 0, cancelled: 0, interrupted: 0 };
  S.jobs.forEach(function (j) { if (counts[j.state] != null) counts[j.state]++; });
  var cbox = $('#jobCounter');
  if (cbox) {
    var items = [['all', '全部'], ['running', '进行中'], ['done', '已完成'], ['partial', '有失败'], ['interrupted', '已中断']];
    cbox.innerHTML = items.map(function (it) {
      return '<span data-f="' + it[0] + '" class="' + (S.jobFilter === it[0] ? 'on' : '') + '">' + it[1] + ' <b>' + counts[it[0]] + '</b></span>';
    }).join('');
  }
  var q = S.jobQuery.trim().toLowerCase();
  var rows = S.jobs.slice();
  if (S.jobFilter !== 'all') rows = rows.filter(function (j) { return j.state === S.jobFilter; });
  if (q) rows = rows.filter(function (j) { return ((j.title || '') + (j.peer || '')).toLowerCase().indexOf(q) >= 0; });
  if (!rows.length) {
    box.innerHTML = '<div class="empty-sm">' + (S.jobs.length ? '没有匹配的任务' : '暂无任务<br>在「新建任务」里选一种类型开始') + '</div>';
    return;
  }
  box.innerHTML = rows.map(function (j) {
    var st = JOB_STATE[j.state] || { t: j.state, c: '#a1a1aa' };
    var pct = jobPct(j);
    var sp = j.speed || S.speeds[j.job_id] || 0;
    var cls = j.state === 'done' ? 'done' : (j.state === 'failed' || j.state === 'partial' || j.state === 'interrupted') ? 'fail' : '';
    var kindTag = j.kind === 'transfer' ? '<span class="tag teal">转存</span>'
      : (j.mode === 'new' ? '<span class="tag teal">新增</span>'
      : (j.mode === 'all' ? '<span class="tag">全量</span>' : ''));
    return '<div class="trow' + (S.jobSel === j.job_id ? ' on' : '') + '" data-j="' + j.job_id + '">'
      + '<div class="l1"><span class="dot" style="background:' + st.c + '"></span>'
      + kindTag
      + '<span class="nm" title="' + esc(j.title || j.peer) + '">' + esc(j.title || j.peer) + '</span>'
      + '<span class="tag">' + st.t + '</span>'
      + (jobRetryable(j) ? '<span class="mini" data-retry="' + j.job_id + '" title="重试失败的文件">重试</span>' : '')
      + '</div>'
      + '<div class="l2"><span>' + j.done + '/' + (j.total || '?') + '</span>'
      + (j.stage ? '<span>·</span><span style="color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">' + esc(j.stage) + '</span>' : '')
      + (j.bytes ? '<span>·</span><span>' + bytes(j.bytes) + (j.size && j.state !== 'done' ? '/' + bytes(j.size) : '') + '</span>' : '')
      + (j.reused ? '<span>·</span><span class="ru" title="本地已有，没有重复下载">复用 ' + j.reused + '</span>' : '')
      + (sp ? '<span>·</span><span style="color:var(--accent)">' + bytes(sp) + '/s</span>' : '') + '</div>'
      + '<div class="pbar ' + cls + '" style="margin-top:5px"><i style="width:' + pct + '%"></i></div></div>';
  }).join('');
  $$('.trow', box).forEach(function (r) {
    r.addEventListener('click', function () {
      S.jobSel = r.dataset.j; S.taskView = 'job'; paintTaskTabs(); paintTaskBody(); paintJobs();
    });
  });
  $$('[data-retry]', box).forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();   // 别顺手把任务也选中
      retryJob(b.dataset.retry);
    });
  });
}

/* 重试：只补没成功的文件，成功后自动跳到新任务上 */
function retryJob(jobId) {
  api('download.retry', { job_id: jobId }).then(function (d) {
    if (!d || d.ok === false) { toast(d && d.error ? d.error : '重试失败'); return; }
    toast('已重新排队，只补没下完的文件');
    S.taskView = 'job'; S.jobSel = d.job_id;
    return refreshJobs(true);
  }).catch(function (e) { toast(e.message); });
}

  body.dataset.jkey = '';
  body.innerHTML = '<div class="pad">'
    + '<div class="box" style="margin-bottom:10px"><div class="box-hd">' + I.plus + '<span>新建任务</span></div>'

      if (c.dataset.act === 'batch') openBatchDialog();
